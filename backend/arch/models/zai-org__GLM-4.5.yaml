# GLM-4.5 / GLM-4.6 family (glm4_moe).
# Dense GQA-with-QK-norm backbone: q/k/v carry a bias (config.attention_bias),
# per-head QK-RMSNorm (use_qk_norm), partial RoPE (partial_rotary_factor 0.5 →
# first 64 of each 128-dim head is rotated). first_k_dense_replace=3 dense
# SwiGLU layers, the rest MoE (160 routed experts d_ffn=1536 + 1 shared,
# noaux_tc sigmoid routing with e_score_correction_bias). One MTP head with a
# private token embedding + private lm-head, shipped as the backbone's tail
# layer index.
match:
  model_type: [glm4_moe]
  model_id: ["zai-org/GLM-4.5"]

components:
  attention: gqa_qknorm_partial_rope_attention
  ffn_dense: swiglu_ffn
  ffn_moe: moe_ffn_gate_routing_bias
  norm: rmsnorm
  block: pre_norm

dims:
  s_max: config.max_position_embeddings   # published context length
  d_model:    config.hidden_size
  n_heads:    config.num_attention_heads
  n_kv_heads:   config.num_key_value_heads ?? n_heads
  d_head:    config.head_dim ?? "d_model // n_heads"
  d_rope:   "d_head // 2"   # partial_rotary_factor 0.5 → int(128 * 0.5) = 64
  d_nope:   "d_head - d_rope"
  Qb:       "1"             # attention_bias=true: Q/K/V carry a bias, o_proj does not
  d_ffn:    config.intermediate_size
  d_ffn_expert:   config.moe_intermediate_size
  n_vocab:    config.vocab_size
  n_layers:    config.num_hidden_layers
  n_experts:    config.n_routed_experts
  n_experts_active:    config.num_experts_per_tok
  n_shared_experts:   config.n_shared_experts ?? "0"
  # Fallbacks are the config class's own defaults (Glm4MoeConfig: n_group = topk_group = 1).
  n_expert_groups:   config.n_group ?? "1"
  n_groups_active:   config.topk_group ?? "1"
  n_dense_layers:   config.first_k_dense_replace
  n_mtp_layers: config.num_nextn_predict_layers ?? "0"

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        - { type: dense, range: ["0", "n_dense_layers - 1"] }
        - { type: moe,   range: [n_dense_layers, "n_layers - 1"] }
      map:
        dense: { attention: gqa_qknorm_partial_rope_attention, ffn: swiglu_ffn }
        moe:   { attention: gqa_qknorm_partial_rope_attention, ffn: moe_ffn_gate_routing_bias }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: embed_tokens, when: config.tie_word_embeddings } , inputs: [norm]}
  # MTP head — private token embedding + private head (mtp_block_with_head),
  # shipped as one extra tail entry of the backbone `layers` index space
  # (model.layers.92.*).
  - name: mtp
    group: true
    aux_kind: mtp
    checkpoint: { prefix: model.layers, index: { after: backbone } }
    inputs: [norm]
    repeat: n_mtp_layers
    streams:
      hidden: { carries: true }
    layers:
      - name: mtp
        template: mtp_block_with_head
        inputs: [norm, input_ids]
        params:
          inner: { template: pre_norm, params: { attn: gqa_qknorm_partial_rope_attention, ffn: moe_ffn_gate_routing_bias, norm: rmsnorm } }

# GLM-4.5 ships pure BF16 weights. The only non-BF16 tensor is the noaux_tc
# router's `e_score_correction_bias`, stored F32 (4 bytes) on disk.
quant_context:
  per_role:
    default: { method: none }
  default_dtype: BF16
  overrides:
    - tensors_re: 'mlp\.gate\.e_score_correction_bias$'
      dtype: F32
