# DeepSeek-V3 family
match:
  model_type: [deepseek_v3]
derived_from: deepseek_v2

components:
  attention: mla_attention
  ffn_dense: swiglu_ffn
  ffn_moe: moe_ffn_gate_routing_bias
  norm: rmsnorm
  block: pre_norm

dims:
  d_model:  config.hidden_size
  n_heads:  config.num_attention_heads
  n_kv_heads: config.num_key_value_heads
  d_qk_nope:  config.qk_nope_head_dim
  d_qk_rope:  config.qk_rope_head_dim
  d_v_head: config.v_head_dim ?? d_qk_nope
  d_kv_lora:  config.kv_lora_rank
  d_q_lora: config.q_lora_rank
  d_ffn:  config.intermediate_size
  d_ffn_expert: config.moe_intermediate_size
  n_vocab:  config.vocab_size
  n_layers:  config.num_hidden_layers
  n_experts:  config.n_routed_experts
  n_experts_active:  config.num_experts_per_tok
  n_shared_experts: config.n_shared_experts ?? "0"
  # noaux_tc grouped routing dims (used by router_noaux_tc inside the
  # MoE component): n_expert_groups groups, top-n_groups_active groups picked per token.
  # Read from config, no fallback: DeepseekV3Config defaults 8 / 4, and every shipped config sets both.
  n_expert_groups: config.n_group
  n_groups_active: config.topk_group
  n_dense_layers: config.first_k_dense_replace
  n_mtp_layers: config.num_nextn_predict_layers ?? "0"
  s_max: config.max_position_embeddings

view:
  rope_theta: config.rope_theta
  rope_scaling: config.rope_scaling
  hidden_act: config.hidden_act
  norm.eps: config.rms_norm_eps

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        - { type: dense, range: ["0", "n_dense_layers - 1"] }
        - { type: moe,   range: [n_dense_layers, "n_layers - 1"] }
      map:
        dense: { attention: mla_attention, ffn: swiglu_ffn }
        moe:   { attention: mla_attention, ffn: moe_ffn_gate_routing_bias }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] , inputs: [norm]}
  # MTP (Multi-Token Prediction) — auxiliary module, not in main inference path.
  # Not a linear chain: enorm (normalizes the new-token embedding) and hnorm
  # (normalizes the previous hidden state) run in parallel and feed a concat →
  # eh_proj before the transformer block. Embed + final head are sequential
  # wrappers around the block.
  - name: mtp
    group: true
    aux_kind: mtp
    # MTP tensors ship as one extra tail entry of the backbone's layer
    # index space (`model.layers.61.*`), not under an `mtp.*` namespace.
    checkpoint: { prefix: model.layers, index: { after: backbone } }
    inputs: [norm]
    repeat: n_mtp_layers
    streams:
      hidden: { carries: true }
    layers:
      - name: mtp
        template: mtp_block_with_head
        inputs: [norm, input_ids]
        params:
          inner: { template: pre_norm, params: { attn: mla_attention, ffn: moe_ffn_gate_routing_bias, norm: rmsnorm } }

# Weights are FP8-E4M3 with per-128×128-tile F32 scale (DeepSeek
# FineGrainedFP8 convention). Scale siblings live in
# `*.weight_scale_inv`; the materialization recipe is in
# `backend/arch/quant_schemes/fp8.yaml`.
#
# Router (`mlp.gate.weight`) is BF16 in the actual checkpoint, not FP8:
# its leaves carry role `router` (`per_role.router`). The
# `e_score_correction_bias` parameter is F32 on disk.
quant_context:
  per_role:
    attention: { method: fp8, block_h: 128, block_w: 128 }
    ffn_dense: { method: fp8, block_h: 128, block_w: 128 }
    ffn_moe:   { method: fp8, block_h: 128, block_w: 128 }
    router:    { method: none }
    default:   { method: none }
  overrides:
    - tensors_re: 'mlp\.gate\.e_score_correction_bias$'
      dtype: F32
  default_dtype: BF16
