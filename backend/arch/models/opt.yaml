# OPT family (gpt-style decoder with absolute positional embeddings,
# separate QKV projections, GELU FFN, bias on all linears).
#
# NOT covered by this spec (different architectures despite superficial
# resemblance): gpt2 (fused QKV via Conv1D, `h.X` naming), gpt_neo,
# gpt_neox (rotary embeddings), bloom (ALiBi + fused QKV); each needs
# its own spec file.
match:
  model_type: [opt]

components:
  attention: mha_attention
  ffn_dense: gelu_ffn
  norm: layernorm
  block: pre_norm

dims:
  d_model:  config.hidden_size
  n_heads:  config.num_attention_heads
  n_kv_heads: config.num_attention_heads
  d_head:  config.head_dim ?? "d_model // n_heads"
  d_ffn:  config.ffn_dim ?? config.intermediate_size ?? "d_model * 4"
  n_vocab:  config.vocab_size
  n_layers:  config.num_hidden_layers
  Fb: "1"    # FFN bias on (gelu_ffn default)
  Qb: "1"    # QKV bias on (OPT default)

view:
  rope_theta: config.rope_theta
  rope_scaling: config.rope_scaling
  hidden_act: config.hidden_act
  norm.eps: config.rms_norm_eps

model_inputs:
  input_ids: { kind: tokens }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - { name: layers, repeat: n_layers, template: block, inputs: [embed_tokens], streams: { hidden: { carries: true } }}
  - { name: final_norm, op: layernorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: embed_tokens, when: config.tie_word_embeddings } , inputs: [final_norm]}
