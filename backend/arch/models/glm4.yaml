# GLM-4 (ChatGLM4) family
# ChatGLM uses a legacy nn.Module hierarchy in its checkpoint — top
# level is `transformer.<…>` (not the standard `model.<…>`), and
# inside the decoder layer the attention is a fused QKV with bias
# (`self_attention.query_key_value.{weight,bias}`) and the FFN is
# fused gate+up (`mlp.dense_h_to_4h.weight`, `mlp.dense_4h_to_h.weight`).
# All of this is encoded in the `chatglm_block` adapter; the model
# file just maps the top-level paths and binds the block.
match:
  model_type: [chatglm]
derived_from: llama

dims:
  s_max: config.seq_length   # published context length
  d_model:  config.hidden_size
  n_heads:  config.num_attention_heads
  n_kv_heads: config.multi_query_group_num ?? n_heads
  d_head:  config.kv_channels ?? "d_model // n_heads"
  d_ffn:  config.ffn_hidden_size
  n_vocab:  config.padded_vocab_size ?? config.vocab_size
  n_layers:  config.num_layers
  Qb: "1"   # ChatGLM ships QKV bias
  Ob: "0"   # output projection has no bias
  Fb: "0"   # FFN linears have no bias
  rope_inv_freq_len: "d_head // 4"

view:
  norm.eps: config.layernorm_epsilon

model_inputs:
  input_ids: { kind: tokens }

model:
  - { name: transformer.embedding.word_embeddings, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - { name: transformer.rotary_pos_emb, op: rotary_inv_freq_buffer, dim: rope_inv_freq_len, weight_axes: [{ replicated: true }] }
  - { name: transformer.encoder.layers, repeat: n_layers, template: chatglm_block, inputs: [transformer.embedding.word_embeddings], streams: { hidden: { carries: true } }}
  - { name: transformer.encoder.final_layernorm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [transformer.encoder.layers]}
  - { name: transformer.output_layer, op: linear, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] , inputs: [transformer.encoder.final_layernorm]}
