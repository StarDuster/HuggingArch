# DeepSeek-V3.2 family (MLA + DSA indexer, with Q compression)
# FP8 *_scale_inv tensors are checkpoint metadata, not model parameters.
match:
  model_type: [deepseek_v32, deepseek_v3_2, deepseek_v3.2, deepseek_v32_exp]
derived_from: deepseek_v3

components:
  attention: mla_dsa_attention
  ffn_dense: swiglu_ffn
  ffn_moe: moe_ffn_gate_routing_bias
  norm: rmsnorm
  block: pre_norm

dims:
  d_model:  config.hidden_size
  n_heads:  config.num_attention_heads
  n_kv_heads: config.num_key_value_heads
  d_qk_nope:  config.qk_nope_head_dim
  d_qk_rope:  config.qk_rope_head_dim
  d_v_head: config.v_head_dim ?? d_qk_nope
  d_kv_lora:  config.kv_lora_rank
  d_q_lora: config.q_lora_rank
  n_indexer_heads: config.index_n_heads ?? "0"
  d_indexer_head: config.index_head_dim ?? "0"
  n_topk_keys: config.index_topk ?? "0"     # DSA sparse top-K (per-query kv positions kept)
  n_indexer_rope_interleave: config.indexer_rope_interleave ?? "0"   # indexer RoPE layout: unset in V3.2 configs, so NeoX (sglang deepseek_v2.py:2086 reads getattr(..., False))
  d_ffn:  config.intermediate_size
  d_ffn_expert: config.moe_intermediate_size
  n_vocab:  config.vocab_size
  n_layers:  config.num_hidden_layers
  n_experts:  config.n_routed_experts
  n_experts_active:  config.num_experts_per_tok
  n_shared_experts: config.n_shared_experts ?? "0"
  # noaux_tc grouped routing dims (router_noaux_tc inside the MoE).
  # Read from config, no fallback: DeepseekV32Config defaults 8 / 4, and every shipped config sets both.
  n_expert_groups: config.n_group
  n_groups_active: config.topk_group
  n_dense_layers: config.first_k_dense_replace
  n_mtp_layers: config.num_nextn_predict_layers ?? "0"
  s_max: config.max_position_embeddings

view:
  rope_theta: config.rope_theta
  rope_scaling: config.rope_scaling
  hidden_act: config.hidden_act
  norm.eps: config.rms_norm_eps

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        - { type: dense, range: ["0", "n_dense_layers - 1"] }
        - { type: moe,   range: [n_dense_layers, "n_layers - 1"] }
      map:
        dense: { attention: mla_dsa_attention, ffn: swiglu_ffn }
        moe:   { attention: mla_dsa_attention, ffn: moe_ffn_gate_routing_bias }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] , inputs: [norm]}
  # MTP (Multi-Token Prediction) — auxiliary module, not in main inference path
  - name: mtp
    group: true
    aux_kind: mtp
    # MTP tensors ship as one extra tail entry of the backbone's layer
    # index space (`model.layers.61.*`), not under an `mtp.*` namespace.
    checkpoint: { prefix: model.layers, index: { after: backbone } }
    inputs: [norm]
    repeat: n_mtp_layers
    streams:
      hidden: { carries: true }
    layers:
      - name: mtp
        template: mtp_block_with_head
        inputs: [norm, input_ids]
        params:
          inner: { template: pre_norm, params: { attn: mla_dsa_attention, ffn: moe_ffn_gate_routing_bias, norm: rmsnorm } }

# Weights are FP8-E4M3 with per-128×128-tile F32 scale. Scale siblings
# live in `*.weight_scale_inv`; recipe in `backend/arch/quant_schemes/fp8.yaml`.
# Overrides (vs DSv3): V3.2 stores every layernorm + indexer norm in F32 —
# same FP8 weights, but the norm gain/bias tensors are F32. Router gate
# (BF16) and e_score_correction_bias (F32) follow DSv3.
quant_context:
  # The reference indexer caches its key in FP8 with one F32 scale per 128
  # channels (inference/model.py:453-454: `act_quant(k, block_size)` into
  # `k_cache` + `k_scale_cache`). The MLA latent is quantised the same way
  # before its write (:569-572, "we use fp8 kv cache in actual deployment,
  # so here we simulate the precision by casting kv to fp8 and then back to
  # bf16"): the BF16 `kv_cache` is a container. The RoPE key goes into
  # `pe_cache` unquantised. The latent's scale is `act_quant(kv, block_size,
  # self.scale_fmt)` with `scale_fmt: ue8m0` in this config, rounded up to a
  # power of two, and serving stores it the same way: FlashMLA's
  # `fp8_ds_mla` record (512 e4m3, four power-of-two F32 scales, the RoPE
  # part bf16), which vLLM's and sglang's sparse decode read.
  cache_formats:
    index_key: fp8_group128
    latent: fp8_pow2_group128
  per_role:
    attention: { method: fp8, block_h: 128, block_w: 128 }
    ffn_dense: { method: fp8, block_h: 128, block_w: 128 }
    ffn_moe:   { method: fp8, block_h: 128, block_w: 128 }
    # The indexer's low-rank [64, d_model] weights_proj stays BF16; its wk /
    # wq_b are FP8 like the main attention and stay under `attention`.
    attention_indexer: { method: none }
    router:    { method: none }
    default:   { method: none }
  overrides:
    # e_score_correction_bias is F32 (the router weight is BF16 by
    # per_role.router, as in DSv3).
    - tensors_re: 'mlp\.gate\.e_score_correction_bias$'
      dtype: F32
    # All norm gains promoted to F32 in V3.2.
    - tensors_re: '(input_layernorm|post_attention_layernorm|enorm|hnorm|q_a_layernorm|kv_a_layernorm|shared_head\.norm|indexer\.k_norm)\.weight$'
      dtype: F32
    # Top-level model.norm
    - tensors: ['model.norm.weight']
      dtype: F32
    # DSA indexer's k_norm has a bias too — F32.
    - tensors_re: 'indexer\.k_norm\.bias$'
      dtype: F32
  default_dtype: BF16
