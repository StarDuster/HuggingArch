# MiMo-V2-Flash (Xiaomi). 309B total / 15B active MoE.
# Hybrid attention: 1 dense + 8 MoE layers use full GQA; 39 layers use
# SWA + per-head learnable attention_sink_bias (s_window=128). KV-head count
# splits by attention class, as the modeling source reads it: the 9 full-GQA
# layers store k_proj=[768,4096]=4×192 and v_proj=[512,4096]=4×128
# (config.num_key_value_heads=4), the 39 SWA layers k_proj=[1536,4096] and
# v_proj=[1024,4096] (config.swa_num_key_value_heads=8). Partial RoPE: only the first d_rope=64 of each head_dim=192
# is rotated. Value head dim (d_v_head=128) differs from QK head dim (d_head=192).
# MoE routing is noaux_tc (sigmoid + e_score_correction_bias).
#
# Auxiliary 3-layer MTP head (lightweight: dense SwiGLU FFN, SWA+sink,
# flash_kv_shards=8 KV heads — k_proj=[1536,4096]=8×192) wraps each block with
# parallel enorm/hnorm → concat → eh_proj and a trailing final_layernorm.
match:
  model_type: [mimo_v2_flash]
derived_from: qwen3_moe

components:
  attention: gqa_partial_rope_vscale_attention
  attention_swa: swa_partial_rope_sink_vscale_attention
  ffn_dense: swiglu_ffn
  ffn_moe: moe_ffn_gate_routing_bias
  norm: rmsnorm
  block: pre_norm

dims:
  d_model:    config.hidden_size
  n_heads:    config.num_attention_heads
  n_kv_heads:   config.num_key_value_heads
  flash_kv_shards:  config.swa_num_key_value_heads
  d_head:    config.head_dim
  d_v_head:   config.v_head_dim ?? d_head
  d_rope:   "(d_head * 334) // 1000"          # int(d_head * partial_rotary_factor) = int(192 * 0.334) = 64
  d_nope:   "d_head - d_rope"
  s_window:    config.sliding_window ?? "128"
  d_ffn:    config.intermediate_size
  d_ffn_expert:   config.moe_intermediate_size
  n_vocab:    config.vocab_size
  n_layers:    config.num_hidden_layers
  n_experts:    config.n_routed_experts
  n_experts_active:    config.num_experts_per_tok
  n_shared_experts:   config.n_shared_experts ?? "0"
  # Read from config, no fallback: MiMoV2FlashConfig defaults 1 / 1, and every shipped config sets both.
  n_expert_groups:   config.n_group
  n_groups_active:   config.topk_group
  n_mtp_layers: config.num_nextn_predict_layers ?? "3"
  s_max: config.max_position_embeddings

view:
  rope_theta: config.rope_theta
  hidden_act: config.hidden_act
  norm.eps: config.layernorm_epsilon
  swa.num_heads: config.swa_num_attention_heads
  swa.head_dim: config.swa_head_dim
  swa.v_head_dim: config.swa_v_head_dim
  swa.rope_theta: config.swa_rope_theta

blocks:
  # MTP layer (vLLM mimo_v2_mtp.py MiMoV2MultiTokenPredictorLayer.forward;
  # sglang mimo_v2_nextn.py): eh_proj(cat[enorm(inputs_embeds),
  # hnorm(previous_hidden_states)]) -> an SWA + sink pre-norm decoder layer ->
  # final_layernorm. `inputs_embeds` is the main embed_tokens output, the
  # hidden state the backbone's final norm. The library head holds that entry;
  # the checkpoint names the trailing norm `final_layernorm` and the decoder's
  # second norm `pre_mlp_layernorm`.
  mimo_v2_mtp_decoder:
    graph:
      layer: { op: pre_norm, in: x, module: null,
               params: { attn: swa_partial_rope_sink_vscale_attention, ffn: swiglu_ffn },
               inner_modules: { post_attention_layernorm: pre_mlp_layernorm } }
    outputs: [layer]
  mimo_v2_mtp_block:
    inputs: [x, inputs_embeds]
    graph:
      layer: { op: mtp_block_shared_head, in: [x, inputs_embeds], module: null,
               params: { inner: mimo_v2_mtp_decoder },
               inner_modules: { shared_head.norm: final_layernorm } }
    outputs: [layer]

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        # Layers with moe_layer_freq == 0 (layer 0): full GQA + dense SwiGLU FFN
        - { type: gqa_dense, from: config.moe_layer_freq, is: '0' }
        # Full GQA + MoE FFN (every 6th layer per hybrid_layer_pattern)
        - { type: gqa_moe,   from: config.hybrid_layer_pattern, is: '0' }
        # Remaining 39 layers: SWA + sink bias + MoE FFN, at
        # swa_num_key_value_heads=8 KV heads.
        - { type: swa_moe,   from: config.hybrid_layer_pattern, is: '1' }
        - { type: swa_moe,   from: config.moe_layer_freq, is: '1' }
      map:
        gqa_dense: { attention: gqa_partial_rope_vscale_attention,      ffn: swiglu_ffn }
        gqa_moe:   { attention: gqa_partial_rope_vscale_attention,      ffn: moe_ffn_gate_routing_bias }
        swa_moe:   { attention: swa_partial_rope_sink_vscale_attention, ffn: moe_ffn_gate_routing_bias, dims: { n_kv_heads: flash_kv_shards } }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] , inputs: [norm]}
  - name: mtp
    group: true
    aux_kind: mtp
    checkpoint: { prefix: model.mtp.layers, index: local }
    inputs: [norm]
    layers:
      # The MTP layer is a windowed layer and stores that class's KV-head
      # count; the rebinding is the backbone's `swa_moe` row's.
      - name: layers
        repeat: n_mtp_layers
        inputs: [norm, embed_tokens]
        streams: { hidden: { carries: true } }
        per_layer:
          assign:
            - { type: mtp, rest: true }
          map:
            mtp: { template: mimo_v2_mtp_block, dims: { n_kv_heads: flash_kv_shards } }
      # MTP logits use the main lm_head, once per MTP layer (vLLM mimo_v2_mtp.py compute_logits).
      - { name: mtp_logits, op: linear, boundary_role: output_head, repeat: n_mtp_layers, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: lm_head } , inputs: [layers]}

# Same FP8-E4M3 + per-128×128-tile F32 scale convention as DSv3. Apart from it:
#   - o_proj.weight is BF16 across main + MTP (config.quantization_config.ignored_layers
#     enumerates every `model.layers.X.self_attn.o_proj` plus MTP `model.decoder.self_attn.o_proj`):
#     the `attention_output` role.
#   - Router `mlp.gate.weight` is F32 (DSv3 keeps it BF16) and
#     `e_score_correction_bias` is F32, as in MiMo-V2.5-Pro.
quant_context:
  per_role:
    attention: { method: fp8, block_h: 128, block_w: 128 }
    ffn_dense: { method: fp8, block_h: 128, block_w: 128 }
    ffn_moe:   { method: fp8, block_h: 128, block_w: 128 }
    attention_output: { method: none }
    router:    { method: none, dtype: F32 }
    default:   { method: none }
  overrides:
    # The K projection's scale grid is blocked PER HEAD in the full-attention
    # layers: `n_kv_heads * ceil(d_head/128)` is 4 x 2 = 8 rows where the
    # scheme's flat rule gives ceil(768/128) = 6, and the file's own scale
    # shape says [8, 32]. Not padding — 768 divides 128 exactly and the
    # exporter still wrote eight.
    #
    # Full attention only. The 39 SWA layers and the MTP stack hold the
    # projection at [1536, 4096] (8 KV heads) with a flat [12, 32] scale.
    - select:
        component: gqa_partial_rope_vscale_attention
        tensors_re: 'k_proj\.weight$'
      dtype: F8_E4M3
      method: fp8
      block_h: 128
      block_w: 128
      scale_shape:
        - "n_kv_heads * ((d_head + block_h - 1) // block_h)"
        - "(in + block_w - 1) // block_w"
    - tensors_re: 'mlp\.gate\.e_score_correction_bias$'
      dtype: F32
  default_dtype: BF16
