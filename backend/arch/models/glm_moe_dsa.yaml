# GLM-5 / GLM-5.1 / GLM-5.2 (glm_moe_dsa).
# MLA + DSA sparse indexer attention, dense prefix, MoE backbone, plus
# one auxiliary MTP block that shares the token embedding and lm_head.
match:
  model_type: [glm_moe_dsa]

components:
  attention: mla_dsa_attention
  ffn_dense: swiglu_ffn
  ffn_moe: moe_ffn_gate_routing_bias
  norm: rmsnorm
  block: pre_norm

dims:
  d_model:    config.hidden_size
  n_heads:    config.num_attention_heads
  n_kv_heads:   config.num_key_value_heads
  d_qk_nope:    config.qk_nope_head_dim
  d_qk_rope:    config.qk_rope_head_dim
  d_v_head:   config.v_head_dim ?? d_qk_nope
  d_kv_lora:    config.kv_lora_rank
  d_q_lora:   config.q_lora_rank
  n_indexer_heads:   config.index_n_heads ?? "0"
  d_indexer_head:   config.index_head_dim ?? "0"
  n_topk_keys:   config.index_topk ?? "0"
  n_indexer_rope_interleave: config.indexer_rope_interleave ?? "0"   # indexer RoPE layout: GLM-5.x configs set true (interleaved)
  d_ffn:    config.intermediate_size
  d_ffn_expert:   config.moe_intermediate_size
  n_vocab:    config.vocab_size
  n_layers:    config.num_hidden_layers
  n_experts:    config.n_routed_experts
  n_experts_active:    config.num_experts_per_tok
  n_expert_groups:    config.n_group       # GlmMoeDsaTopkRouter group-limited top-k (modeling_glm_moe_dsa.py:480-495)
  n_groups_active:    config.topk_group
  n_shared_experts:   config.n_shared_experts ?? "0"
  n_dense_layers:   config.first_k_dense_replace
  n_mtp_layers: config.num_nextn_predict_layers ?? "0"
  s_max: config.max_position_embeddings

view:
  hidden_act: config.hidden_act
  norm.eps: config.rms_norm_eps

# Architecturally-significant config fields intentionally not consumed:
#   mlp_layer_types           — the dense/sparse FFN split is identical to
#                               `first_k_dense_replace` (n_dense_layers), already modeled
#                               by the dense-prefix range assignment.
#   moe_layer_freq            — every post-dense layer is MoE (=1); the
#                               dense/MoE split is encoded by
#                               `first_k_dense_replace` (n_dense_layers), already modeled.
#   index_topk_freq /
#   index_skip_topk_offset /
#   index_share_for_mtp_iteration /
#   index_topk_pattern        — DSA top-k COMPUTE cadence (how often the
#                               indexer recomputes top-k). No param/KV-geometry
#                               footprint; the full-vs-shared split — weights and
#                               indexer compute — is modeled via `indexer_types`.

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    # `hidden` is the state the stack carries from layer to layer. `dsa_topk`
    # is DSA lightning-indexer sharing as an inner-node stream: full/dense
    # layers compute the top-K (dsa_topk_mask), and GLM-5.2's "shared" layers
    # reuse the selection of the nearest full layer before them (HF's decoder
    # loop hands `prev_topk_indices=topk_indices` on, and a shared layer
    # returns the top-K it was handed).
    # Topology only — params / FLOPs unchanged; the producer/consumer live in
    # different variant components (mla_dsa_attention stream_out,
    # mla_dsa_attention_shared reads), not at the block boundary.
    streams:
      hidden: { carries: true }
      dsa_topk:
        shape: [B, s_query, n_topk_keys]
        src: "GlmMoeDsaAttention.forward threads `prev_topk_indices` across layers"
    # Per-layer template = generators (declaration-order, first-wins) + a
    # type→template map. The dense prefix claims layers 0..n_dense_layers-1 first (they
    # are also "full" in indexer_types); the `full`/`shared` generators then
    # read each backbone layer's indexer variant straight from the config
    # list. GLM-5.1 lacks `indexer_types`, so those generators select nothing
    # and the `rest` generator gives every non-dense layer the full indexer —
    # reproducing the uniform 5.1 modeling exactly. Exhaustiveness is enforced:
    # an indexer_types value absent from the map fails validation.
    per_layer:
      assign:
        - { type: dense,  range: ["0", "n_dense_layers - 1"] }
        - { type: full,   from: "config.indexer_types ?? absent", is: full }
        # A shared layer reads the top-K of the nearest full layer before it
        # (GlmMoeDsaAttention: `topk_indices = prev_topk_indices`).
        - { type: shared, from: "config.indexer_types ?? absent", is: shared,
            reads_from: { dsa_topk: { nearest: { from: "config.indexer_types ?? absent", is: full } } } }
        - { type: full,   rest: true }   # GLM-5.1 fallback (no indexer_types)
      map:
        dense:  { attention: mla_dsa_attention,        ffn: swiglu_ffn }
        full:   { attention: mla_dsa_attention,        ffn: moe_ffn_gate_routing_bias }
        shared: { attention: mla_dsa_attention_shared, ffn: moe_ffn_gate_routing_bias }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: embed_tokens, when: config.tie_word_embeddings } , inputs: [norm]}
  # The auxiliary next-token prediction block reuses embed_tokens + lm_head.
  # Its extra stored params are: enorm, hnorm, eh_proj, one full MoE decoder
  # block, and shared_head.norm.
  - name: mtp
    group: true
    aux_kind: mtp
    # MTP tensors ship as one extra tail entry of the backbone's layer
    # index space (`model.layers.78.*`), not under an `mtp.*` namespace.
    checkpoint: { prefix: model.layers, index: { after: backbone } }
    inputs: [norm]
    repeat: n_mtp_layers
    streams:
      hidden: { carries: true }
    layers:
      - name: mtp
        template: mtp_block_shared_head
        inputs: [norm, embed_tokens]
        params:
          inner: { template: pre_norm, params: { attn: mla_dsa_attention, ffn: moe_ffn_gate_routing_bias, norm: rmsnorm } }
      # The checkpoint has no shared_head.head; vLLM shares the target lm_head into it (v1/spec_decode/llm_base_proposer.py _maybe_share_lm_head) and deepseek_mtp.py compute_logits projects with it.
      - { name: mtp_logits, op: linear, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: lm_head } , inputs: [mtp]}

# GLM-5 / 5.1 / 5.2 ship pure BF16 weights — no weight quantization. The only
# non-BF16 tensor is the noaux_tc router's `e_score_correction_bias`,
# which is stored in F32 (4 bytes) on disk like the DeepSeek-family
# checkpoints. Without this override the analyzer assumes the
# default BF16 (2 bytes) and undercounts it by 2 bytes/param.
quant_context:
  # The indexer key cache as sglang's default CUDA path stores it (caches
  # follow serving): FP8 E4M3 with one F32 scale per 128 channels, 132 B a
  # key, the scale `fmaxf(1e-4, amax) / 448` — NOT rounded to a power of
  # two (`FusedKIndexerNormRopeStoreKernel`, kernels/jit/csrc/deepseek_v32/
  # indexer_k.cuh:330,344; the same record in dsa/fused_store_index_cache.
  # cuh:66). sglang's Indexer is constructed with `scale_fmt="ue8m0"`
  # (models/deepseek_v2.py:2099), but that knob reaches only the unfused
  # fallback and the query side: `_fused_k_prepare_and_store` (dsa_indexer.
  # py:995) takes the fused kernel whenever it compiles
  # (`can_use_dsa_fused_store` gates on dtype and page size only), and the
  # fused kernel takes no scale format. vLLM's GLM-MoE-DSA path rounds the
  # scale to ue8m0 (models/deepseek_v32/attention.py:90-98) — a
  # writer-side rounding difference on one layout, which is why the reader
  # (`deepgemm_fp8_paged_mqa_logits`) declares both records. HF's forward
  # keeps it BF16.
  cache_formats:
    index_key: fp8_group128
  per_role:
    default: { method: none }
  default_dtype: BF16
  overrides:
    - tensors_re: 'mlp\.gate\.e_score_correction_bias$'
      dtype: F32
