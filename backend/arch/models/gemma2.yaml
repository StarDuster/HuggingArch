# Gemma 2 (2B / 9B / 27B) — text-only.
# Block topology is the 4-norm pattern (input / post_attention /
# pre_feedforward / post_feedforward layernorms wrapping attn + ffn);
# no layer_scalar (that's a Gemma 4 addition). FFN is GeGLU with the tanh
# approximation of GELU: Gemma2MLP applies ACT2FN[config.hidden_activation]
# and every Gemma 2 config sets `gelu_pytorch_tanh` (vLLM gemma2.py refuses
# anything else and builds GeluAndMul(approximate="tanh")), so the FFN is
# `gemma_geglu_ffn` (gated_ffn, act gelu_tanh); validate checks the act
# against the config. lm_head is
# tied to embed_tokens (default tie_word_embeddings=True for Gemma2).
#
# Attention alternates per layer: Gemma2DecoderLayer sets
# `is_sliding = not bool(layer_idx % 2)`, so EVEN layers use sliding
# window attention (config.sliding_window, default 4096) and ODD layers
# use full GQA. Both are plain GQA shape-wise (no QK-norm); only the KV
# growth law differs — sliding layers cap at s_window, full layers grow per
# token. Modeling this split is what makes per-request KV cap correctly
# instead of growing linearly across all n_layers layers.
match:
  model_type: [gemma2]

components:
  attention: swa_attention
  ffn_dense: gemma_geglu_ffn
  norm: rmsnorm
  block: gemma2_4norm_block

dims:
  d_model:  config.hidden_size
  n_heads:  config.num_attention_heads
  n_kv_heads: config.num_key_value_heads ?? n_heads
  d_head:  config.head_dim ?? "d_model // n_heads"
  s_window:  config.sliding_window ?? "4096"
  d_ffn:  config.intermediate_size
  n_vocab:  config.vocab_size
  # Soft-caps when final_logit_softcapping is not None; Gemma2Config defaults it to 30.0.
  n_logit_softcap: present(config.final_logit_softcapping) ?? "1"
  n_layers:  config.num_hidden_layers
  s_max: config.max_position_embeddings

view:
  rope_theta: config.rope_theta
  hidden_act: config.hidden_act ?? config.hidden_activation
  norm.eps: config.rms_norm_eps

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        # Even layers (0, 2, 4, …): sliding-window attention, KV caps at s_window.
        - { type: swa,  stride: "2", offset: "0" }
        # Odd layers (1, 3, 5, …): full GQA, KV grows per token.
        - { type: full, rest: true }
      map:
        swa:  { template: gemma2_4norm_block, params: { attn: swa_attention, ffn: gemma_geglu_ffn } }
        full: { template: gemma2_4norm_block, params: { attn: gqa_attention, ffn: gemma_geglu_ffn } }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  # lm_head weight is tied to embed_tokens — no separate tensor in the
  # checkpoint. Gemma2Config defaults tie_word_embeddings=True in Python,
  # but the published config.json omits the field and the engine reads raw
  # JSON, so the absent field falls back to true here.
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: embed_tokens, when: "config.tie_word_embeddings ?? true" } , inputs: [norm]}
  # Gemma2ForCausalLM caps the logits: c·tanh(logits/c), c = final_logit_softcapping.
  - { name: final_logit_softcap, op: logit_softcap, inputs: [lm_head] }
