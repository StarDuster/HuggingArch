# MiniMax-M2.7 (MiniMaxAI/MiniMax-M2.7)
# Sparse MoE: 256 experts, top-8, no shared experts. Load-balance bias on router.
# GQA with flat (pre-view) QK-RMSNorm and partial RoPE (rotary_dim < head_dim).
# All 62 layers homogeneous (config.attn_type_list is all 1s).
match:
  model_type: [minimax_m2]

components:
  attention: gqa_flat_qknorm_partial_rope_attention
  norm: rmsnorm
  block: pre_norm

dims:
  d_model:  config.hidden_size
  n_heads:  config.num_attention_heads
  n_kv_heads: config.num_key_value_heads ?? n_heads
  d_head:  config.head_dim ?? "d_model // n_heads"
  d_rope: config.rotary_dim ?? d_head
  d_ffn:  config.intermediate_size
  d_ffn_expert: config.intermediate_size
  n_vocab:  config.vocab_size
  n_layers:  config.num_hidden_layers
  n_experts:  config.num_local_experts
  n_experts_active:  config.num_experts_per_tok
  s_max: config.max_position_embeddings

view:
  rope_theta: config.rope_theta
  hidden_act: config.hidden_act
  norm.eps: config.rms_norm_eps

# Decoder topology lives in components/library/minimax_m2_decoder_block.yaml
# (custom inline wiring required to match HF's `block_sparse_moe.experts.w1/w2/w3`
# tensor naming).

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - { name: layers, repeat: n_layers, template: minimax_m2_decoder_block, inputs: [embed_tokens], streams: { hidden: { carries: true } }}
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] , inputs: [norm]}

# FP8-E4M3 + per-128×128-tile F32 scale.
# config.quantization_config.modules_to_not_convert = ['gate', 'e_score_correction_bias', 'lm_head']
# tracks the F32 router weights + the embedding/lm_head left BF16.
quant_context:
  per_role:
    attention: { method: fp8, block_h: 128, block_w: 128 }
    ffn_dense: { method: fp8, block_h: 128, block_w: 128 }
    ffn_moe:   { method: fp8, block_h: 128, block_w: 128 }
    # Router gate (`block_sparse_moe.gate.weight`) and the routing bias stay
    # at fp32 — modules_to_not_convert lists `gate` + `e_score_correction_bias`.
    router:    { method: none, dtype: F32 }
    default:   { method: none }
  overrides:
    - tensors_re: 'block_sparse_moe\.e_score_correction_bias$'
      dtype: F32
  default_dtype: BF16
