# DeepSeek-V4.1-Flash — `model_type: deepseek_v41`, `DeepseekV41ForCausalLM`.
#
# A new spec rather than a `base:` of deepseek_v4.yaml / DeepSeek-V4-Flash.yaml:
# the transformers environment cannot build this skeleton, and the three things
# that define V4.1 have no V4 counterpart.
#
# 1) SINGLE-PASS HYPER-CONNECTIONS. V4-Pro/V4-Flash run `hc_pre` as a fused
#    "compute my mixes, reduce with my own `pre`" unit (library/hc_pre.yaml:41).
#    V4.1's Block docstring says the opposite — "The coefficients a sublayer
#    computes are used by the *next* one" (source/model.py:914) — and `forward`
#    (source/model.py:976-994) proves it: `self.hc_pre(x, pre_mix)` before
#    attention uses the PREVIOUS LAYER's `ffn_pre`, and `self.hc_pre(x,
#    attn_pre)` before the FFN uses this layer's attention mixes. The layer
#    returns `(x, ffn_pre)`. That is a cross-layer coefficient stream
#    (`hc_pre_mix` below) and it cannot be expressed by rewiring dsv4_block.
#    The exit reduce is `layer.hc_pre(h, pre_mix)` (source/model.py:1268) with
#    the parameter-free seed `make_identity_pre_mix` (:1159-1163) — which is why
#    there is no `hc_head_*` tensor anywhere in the checkpoint, unlike V4-Pro.
#
# 2) CSA2 WITH CROSS-LAYER KV / INDEX / CANDIDATE SHARING. `compress_ratios`
#    (config) is [0,0, 2×18, 1×20, 0,0,0]; `kv_source_layer_ids` [2,8,14,20] own
#    a Compressor, `index_source_layer_ids` [2,8,14,20,24,28,32,36] own an
#    Indexer, and `candidate_source_layer_id` 20 additionally runs
#    `select_candidate_blocks`. Every other backbone layer READS the shared
#    state (`SharedAttentionRuntime`, source/model.py:653-661, 739-789). That is
#    four distinct attention shapes, confirmed leaf-for-leaf by pattern_counts:
#    `compressor.wkv` ×4, `compressor.wgate` ×3 (ratio-1 layer 20 skips the
#    gate), `indexer.wq_b` ×8, `indexer.wk` ×4 (snapshot:2333-2339).
#
# 3) ENGRAM + VL ROUTING + DSPARK MTP. Layers 1 and 14 carry an n-gram hash
#    retrieval (`engram_layer_ids`), every MoE gate carries TWO F32 correction
#    biases (`bias` and `bias_vl`, ×40 each), and the 3 MTP stages are
#    DSparkBlocks with 128 experts, a window-only `DSparkAttention` fed by the
#    mean of layers 37/38/39's inputs, and a Markov + confidence head.
#
# Every component it needs is in components/library/ (the dsv41_* and csa2_* files).
match:
  model_type: [deepseek_v41]
  model_id: ["deepseek-ai/DeepSeek-V4.1-Flash"]

components:
  # Every CSA2 layer runs the one attention body (`library/csa2_attention`);
  # what differs per layer is which form of `_compress_kv` its three slots
  # bind — compressor / indexer / compressed (`per_layer.map` below).
  attention: csa2_attention
  # `compress_ratios[i] == 0` (layers 0 and 1): no compressor, no indexer.
  # V4.1's `Attention.forward` has no per-head query norm, so the DSv4 body
  # runs with `n_q_head_norm: "0"`.
  attention_swa: dsv4_swa_only_attention
  ffn_dense: swiglu_ffn            # unused — DSv4.1 has no dense FFN layer
  ffn_moe: dsv41_moe_vl
  norm: rmsnorm
  block: dsv41_hc_block


dims:
  # `Attention.forward` goes straight from `wq_b` to `apply_rotary_emb`
  # (source/model.py:767-768): no per-head query RMS norm, unlike V4-Pro /
  # V4-Flash, so `dsv4_swa_only_attention`'s `q_head_norm` step is off.
  n_q_head_norm:        "0"
  # --- text backbone (config.text_config) ---
  d_model:              config.text_config.hidden_size              # 5120
  n_heads:              config.text_config.num_attention_heads      # 64
  d_head:               config.text_config.head_dim                 # 512
  d_qk_rope:            config.text_config.qk_rope_head_dim          # 64 (partial RoPE: last 64 dims)
  d_q_lora:             config.text_config.q_lora_rank               # 1280
  d_out_lora:           config.text_config.o_lora_rank               # 1024
  n_out_lora_groups:    config.text_config.o_groups                  # 8
  d_out_lora_group_in:  "n_heads * d_head // n_out_lora_groups"       # 4096
  s_window:             config.text_config.sliding_window            # 128
  # --- CSA2 indexer / candidate selection ---
  n_indexer_heads:      config.text_config.index_n_heads             # 32
  d_indexer_head:       config.text_config.index_head_dim            # 128
  n_topk_keys:          config.text_config.index_topk                # 512
  # `compress_ratios` is per-layer (0 / 2 / 1), so every block gets its own value
  # from the `per_layer.map` below. This model-level default is the ratio of the
  # LAST kv_source (layer 20, `compress_ratios[20] == 1`), which is the one whose
  # buffers the shared `compress_kv` / `index_k` streams carry for most of the
  # stack — i.e. the widest compressed length the streams ever hold.
  # `compress_ratios` is per-layer (0 / 2 / 1), so every block takes its own
  # value from the `per_layer.map` below. This model-level default is the ratio
  # of the LAST kv_source (layer 20, `compress_ratios[20] == 1`), whose buffers
  # the shared `compress_kv` / `index_k` streams carry for most of the stack.
  compress_ratio:       config.text_config.compress_ratios.20       # 1
  compress_ratio_source: config.text_config.compress_ratios.2       # 2
  n_topk_blocks:        config.text_config.candidate_topk_blocks     # 2048
  s_sparse_block:       config.text_config.candidate_block_size      # 8
  # --- MoE ---
  d_ffn_expert:         config.text_config.moe_intermediate_size     # 2304
  n_experts:            config.text_config.n_routed_experts          # 384
  # `self.experts = nn.ModuleList([Expert(...) for i in range(self.n_routed_experts)])`
  # (source/model.py:889-892) — one unrolled copy per routed expert, so the
  # copies axis IS the routed-expert count, which is what `n_expert_copies`
  # derives (dims.yaml).
  n_experts_active:     config.text_config.num_experts_per_tok       # 6
  n_shared_experts:     config.text_config.n_shared_experts ?? "1"   # 1
  d_ffn_shared:         "d_ffn_expert * n_shared_experts"            # 2304
  # --- backbone scalars ---
  n_vocab:              config.text_config.vocab_size                # 129280
  n_layers:             config.text_config.num_hidden_layers         # 40
  n_mtp_layers:         config.text_config.num_nextn_predict_layers  # 3
  s_max:                config.text_config.max_position_embeddings   # 1048576
  # The clamped SwiGLU bound every routed and shared expert clamps to
  # (source/model.py Expert.forward `swiglu_limit`).
  clamp_limit:          config.text_config.swiglu_limit              # 10.0
  # --- Hyper-Connections ---
  n_hidden_copies:      config.text_config.hc_mult                   # 4
  d_hc_mix:             "(2 + n_hidden_copies) * n_hidden_copies"    # 24
  # --- vision tower (config.vision_config) ---
  d_vis_model:          config.vision_config.hidden_size             # 1024
  n_vis_heads:          config.vision_config.num_attention_heads     # 16
  d_vis_head:           "d_vis_model // n_vis_heads"                  # 64
  d_vis_ffn:            config.vision_config.intermediate_size       # 2816
  n_vis_layers:         config.vision_config.num_hidden_layers       # 32
  n_vis_channels:       "3"                                          # RGB
  s_patch:              config.vision_config.patch_size              # 14
  n_spatial_merge:      config.vision_config.downsample_ratio        # 3
  d_proj_in:            "d_vis_model * n_spatial_merge * n_spatial_merge"   # 9216 (= aligner.w1's in-width)
  # --- Engram (backbone layers 1 and 14) ---
  # The n-gram vocabulary of `dims.yaml`: a position hashes its `n_ngram - 1`
  # grams over `n_ngram_heads_per_gram` heads, so the table is gathered
  # `n_ngram_heads` times per position and the rows flatten into one vector —
  # the same three symbols Qwen3.8's PLE binds, at this model's values.
  n_ngram:              config.text_config.engram_max_ngram_size     # 4
  n_ngram_heads_per_gram: config.text_config.engram_n_heads          # 8
  n_ngram_heads:        "(n_ngram - 1) * n_ngram_heads_per_gram"     # 24
  d_ngram_head:         config.text_config.engram_head_dim           # 256
  # `wkv`'s output width, `dim * (hc_mult + 1)` (source/model.py:345): the
  # four hc copies' keys and the one shared value.
  d_engram_kv:          "d_model * (n_hidden_copies + 1)"            # 25600
  # The two tables' heights (`engram_num_embeddings`), one per engram layer.
  n_engram_rows_a:      config.text_config.engram_num_embeddings.0   # 384006168
  n_engram_rows_b:      config.text_config.engram_num_embeddings.1   # 384016682
  # --- DSpark MTP stages ---
  d_markov_rank:        config.text_config.dspark_markov_rank        # 256
  n_dspark_experts:     config.text_config.dspark_n_routed_experts   # 128
  n_dspark_experts_active: config.text_config.dspark_num_experts_per_tok  # 3
  s_dspark_block:       config.text_config.dspark_block_size         # 5

view:
  rope_theta: config.text_config.rope_theta
  rope_scaling: config.text_config.rope_scaling
  hidden_act: config.text_config.hidden_act
  norm.eps: config.text_config.rms_norm_eps

# ---------------------------------------------------------------------------
# DSpark MTP stages (`mtp.0/1/2`, layer_ids 40/41/42).
#
# `DSparkBlock(Block)` (source/model.py:1100-1156) keeps the whole single-pass
# HC body and swaps the attention for `DSparkAttention`, so each stage repeats
# the dsv41_hc_block wiring verbatim. The stages are NOT interchangeable, so
# they are three inline templates rather than one:
#   stage 0 (`stage_id == 0`, :1107-1109) owns `main_proj` + `main_norm`, which
#           turn the concatenated taps of layers 37/38/39 into `main_x` — the
#           KV source every stage's attention reads.
#   stage 2 (`stage_id == n_mtp_layers - 1`, :1110-1113) owns `norm`,
#           `markov_head` (embed + head at dspark_markov_rank) and
#           `confidence_head`.
#   stage 1 has neither (pattern_counts: main_proj ×1, norm ×1 against
#           hc_attn_fn ×3 — snapshot:2371-2376).
# `self.embed = None; self.head = None` (:1114-1115) then
# `self.mtp[-1].head = self.head` (:1212-1213): the stages share the main
# table and the main projection, so no private copy is declared.
#
# The per-stage dims live in `dims:`: d_markov_rank (=256, main_proj fan-in is
# d_model × len(dspark_target_layer_ids) = 3 taps), n_dspark_experts (=128) and
# n_dspark_experts_active (=3) override the backbone's MoE counts inside this
# group (source/model.py `get_moe_config`).
# ---------------------------------------------------------------------------
blocks:
  dspark_stage_first:
    # `mtp_hc_pre_mix` is RE-SEEDED by the MTP loop with the parameter-free
    # make_identity_pre_mix (source/model.py:1277) — the stream's `seed`,
    # `mtp_hc_seed`, as at backbone layer 0 — so this stage's attention reduce
    # reads the seed, and it publishes its own ffn_pre for stage 1.
    # The three main_hidden_* appended streams are the backbone's taps; each
    # arrives as the flattened carried stream [B, s, n_hidden_copies * d_model]
    # and the tap is `h.mean(dim=2)` (source/model.py:1266) — parameter-free,
    # computed here before the concat.
    reads: [mtp_hc_pre_mix, main_hidden_37, main_hidden_38, main_hidden_39]
    inputs: [x, input_ids]
    stream_out:
      mtp_hc_pre_mix: hc_ffn_split
      main_x: main_norm
    graph:
      # The taps: mean over the hc copies of each tapped layer input, then
      # `torch.cat(main_hiddens, dim=-1)` (source/model.py:1271).
      tap37_split: { op: view_split, in: main_hidden_37, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model } }
      tap37_sum:   { op: sum_reduce, in: tap37_split, axis: 2, dims: { in: n_hidden_copies } }
      tap37_mean:  { op: scale_const, in: tap37_sum, dims: { in: d_model }, formula: "y = tap37_sum / n_hidden_copies   (h.mean(dim=2), source/model.py:1266)" }
      tap38_split: { op: view_split, in: main_hidden_38, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model } }
      tap38_sum:   { op: sum_reduce, in: tap38_split, axis: 2, dims: { in: n_hidden_copies } }
      tap38_mean:  { op: scale_const, in: tap38_sum, dims: { in: d_model }, formula: "y = tap38_sum / n_hidden_copies   (h.mean(dim=2), source/model.py:1266)" }
      tap39_split: { op: view_split, in: main_hidden_39, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model } }
      tap39_sum:   { op: sum_reduce, in: tap39_split, axis: 2, dims: { in: n_hidden_copies } }
      tap39_mean:  { op: scale_const, in: tap39_sum, dims: { in: d_model }, formula: "y = tap39_sum / n_hidden_copies   (h.mean(dim=2), source/model.py:1266)" }
      main_cat_ab: { op: concat, in: [tap37_mean, tap38_mean], dims: { in_a: d_model, in_b: d_model, out: "2 * d_model" } }
      main_cat:    { op: concat, in: [main_cat_ab, tap39_mean], dims: { in_a: "2 * d_model", in_b: d_model, out: "3 * d_model" } }
      # `main_x = self.main_norm(self.main_proj(main_hidden))` (source/model.py:1136)
      # over the concatenated taps — 3 × 5120 = 15360 in.
      main_proj:     { op: linear, in: main_cat, dims: { in: "d_model * 3", out: d_model }, weight_axes: [{ replicated: true }, { replicated: true }] }
      main_norm:     { op: rmsnorm, in: main_proj, dim: d_model, weight_axes: [{ replicated: true }] }

      hc_attn_fn:    { op: parameter_tensor, role: hyper_connection, shape: [d_hc_mix, "n_hidden_copies * d_model"], weight_axes: [{ replicated: true }, { replicated: true }] }
      hc_attn_base:  { op: parameter_vector, role: hyper_connection, dim: d_hc_mix, weight_axes: [{ replicated: true }] }
      hc_attn_scale: { op: parameter_vector, role: hyper_connection, dim: "3", weight_axes: [{ replicated: true }] }
      hc_ffn_fn:     { op: parameter_tensor, role: hyper_connection, shape: [d_hc_mix, "n_hidden_copies * d_model"], weight_axes: [{ replicated: true }, { replicated: true }] }
      hc_ffn_base:   { op: parameter_vector, role: hyper_connection, dim: d_hc_mix, weight_axes: [{ replicated: true }] }
      hc_ffn_scale:  { op: parameter_vector, role: hyper_connection, dim: "3", weight_axes: [{ replicated: true }] }

      hc_attn_split: { op: dsv41_hc_mixes, in: [x, hc_attn_fn, hc_attn_scale, hc_attn_base] }
      # The copy axis, re-exposed for the cross-copy HC ops — see
      # `library/dsv41_hc_block.yaml`.
      x_hc:          { op: view_split, in: x, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model } }
      attn_reduce:   { op: hc_weighted_reduce, in: [x_hc, mtp_hc_pre_mix], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      attn_norm:     { op: rmsnorm, in: attn_reduce, dim: d_model, weight_axes: [{ replicated: true }] }
      attn:          { op: dsv41_dspark_attention, in: [attn_norm, main_norm] }
      attn_out:      { op: hc_post, in: [attn, x_hc, hc_attn_split.post, hc_attn_split.comb] }
      attn_out_flat: { op: view_merge, in: attn_out }

      hc_ffn_split:  { op: dsv41_hc_mixes, in: [attn_out_flat, hc_ffn_fn, hc_ffn_scale, hc_ffn_base] }
      ffn_reduce:    { op: hc_weighted_reduce, in: [attn_out, hc_attn_split], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      ffn_norm:      { op: rmsnorm, in: ffn_reduce, dim: d_model, weight_axes: [{ replicated: true }] }
      # 128 routed experts, top-3 (dspark_n_routed_experts / dspark_num_experts_per_tok).
      # The stage's routing is its own: this call rebinds `n_experts`, and its
      # frame derives the bank's expert axis `n_expert_copies` (the
      # unrolled-ModuleList count, `mtp.X.ffn.experts.{0..127}`) and the
      # dispatch denominator `n_route_targets` from it — which is also the
      # gate's output width — so the rows one expert receives are
      # `B*s*3/128`.
      ffn:           { op: dsv41_moe_vl, in: ffn_norm, dims: { n_experts: n_dspark_experts, n_experts_active: n_dspark_experts_active} }
      out:           { op: hc_post, in: [ffn, attn_out, hc_ffn_split.post, hc_ffn_split.comb] }
      out_flat:      { op: view_merge, in: out }
    outputs: [out_flat]

  dspark_stage_mid:
    reads: [mtp_hc_pre_mix, main_x]
    inputs: [x, input_ids]
    stream_out:
      mtp_hc_pre_mix: hc_ffn_split
    graph:
      hc_attn_fn:    { op: parameter_tensor, role: hyper_connection, shape: [d_hc_mix, "n_hidden_copies * d_model"], weight_axes: [{ replicated: true }, { replicated: true }] }
      hc_attn_base:  { op: parameter_vector, role: hyper_connection, dim: d_hc_mix, weight_axes: [{ replicated: true }] }
      hc_attn_scale: { op: parameter_vector, role: hyper_connection, dim: "3", weight_axes: [{ replicated: true }] }
      hc_ffn_fn:     { op: parameter_tensor, role: hyper_connection, shape: [d_hc_mix, "n_hidden_copies * d_model"], weight_axes: [{ replicated: true }, { replicated: true }] }
      hc_ffn_base:   { op: parameter_vector, role: hyper_connection, dim: d_hc_mix, weight_axes: [{ replicated: true }] }
      hc_ffn_scale:  { op: parameter_vector, role: hyper_connection, dim: "3", weight_axes: [{ replicated: true }] }

      hc_attn_split: { op: dsv41_hc_mixes, in: [x, hc_attn_fn, hc_attn_scale, hc_attn_base] }
      x_hc:          { op: view_split, in: x, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model } }
      attn_reduce:   { op: hc_weighted_reduce, in: [x_hc, mtp_hc_pre_mix], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      attn_norm:     { op: rmsnorm, in: attn_reduce, dim: d_model, weight_axes: [{ replicated: true }] }
      attn:          { op: dsv41_dspark_attention, in: [attn_norm, main_x] }
      attn_out:      { op: hc_post, in: [attn, x_hc, hc_attn_split.post, hc_attn_split.comb] }
      attn_out_flat: { op: view_merge, in: attn_out }

      hc_ffn_split:  { op: dsv41_hc_mixes, in: [attn_out_flat, hc_ffn_fn, hc_ffn_scale, hc_ffn_base] }
      ffn_reduce:    { op: hc_weighted_reduce, in: [attn_out, hc_attn_split], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      ffn_norm:      { op: rmsnorm, in: ffn_reduce, dim: d_model, weight_axes: [{ replicated: true }] }
      ffn:           { op: dsv41_moe_vl, in: ffn_norm, dims: { n_experts: n_dspark_experts, n_experts_active: n_dspark_experts_active} }
      out:           { op: hc_post, in: [ffn, attn_out, hc_ffn_split.post, hc_ffn_split.comb] }
      out_flat:      { op: view_merge, in: out }
    outputs: [out_flat]

  dspark_stage_last:
    reads: [mtp_hc_pre_mix, main_x]
    inputs: [x, input_ids]
    graph:
      hc_attn_fn:    { op: parameter_tensor, role: hyper_connection, shape: [d_hc_mix, "n_hidden_copies * d_model"], weight_axes: [{ replicated: true }, { replicated: true }] }
      hc_attn_base:  { op: parameter_vector, role: hyper_connection, dim: d_hc_mix, weight_axes: [{ replicated: true }] }
      hc_attn_scale: { op: parameter_vector, role: hyper_connection, dim: "3", weight_axes: [{ replicated: true }] }
      hc_ffn_fn:     { op: parameter_tensor, role: hyper_connection, shape: [d_hc_mix, "n_hidden_copies * d_model"], weight_axes: [{ replicated: true }, { replicated: true }] }
      hc_ffn_base:   { op: parameter_vector, role: hyper_connection, dim: d_hc_mix, weight_axes: [{ replicated: true }] }
      hc_ffn_scale:  { op: parameter_vector, role: hyper_connection, dim: "3", weight_axes: [{ replicated: true }] }

      hc_attn_split: { op: dsv41_hc_mixes, in: [x, hc_attn_fn, hc_attn_scale, hc_attn_base] }
      x_hc:          { op: view_split, in: x, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model } }
      attn_reduce:   { op: hc_weighted_reduce, in: [x_hc, mtp_hc_pre_mix], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      attn_norm:     { op: rmsnorm, in: attn_reduce, dim: d_model, weight_axes: [{ replicated: true }] }
      attn:          { op: dsv41_dspark_attention, in: [attn_norm, main_x] }
      attn_out:      { op: hc_post, in: [attn, x_hc, hc_attn_split.post, hc_attn_split.comb] }
      attn_out_flat: { op: view_merge, in: attn_out }

      hc_ffn_split:  { op: dsv41_hc_mixes, in: [attn_out_flat, hc_ffn_fn, hc_ffn_scale, hc_ffn_base] }
      ffn_reduce:    { op: hc_weighted_reduce, in: [attn_out, hc_attn_split], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      ffn_norm:      { op: rmsnorm, in: ffn_reduce, dim: d_model, weight_axes: [{ replicated: true }] }
      ffn:           { op: dsv41_moe_vl, in: ffn_norm, dims: { n_experts: n_dspark_experts, n_experts_active: n_dspark_experts_active} }
      block_out:     { op: hc_post, in: [ffn, attn_out, hc_ffn_split.post, hc_ffn_split.comb] }

      # `forward_head` (source/model.py:1142-1156):
      #   x = self.hc_pre(x, pre_mix)            # this stage's own ffn_pre
      #   logits = self.head(self.norm(x), full_logits=True)
      #   for _ in range(...): logits += logits_bias from markov_head
      #   confidence = self.confidence_head(x, markov_embed)
      hc_exit:       { op: hc_weighted_reduce, in: [block_out, hc_ffn_split], dims: { n_hidden_copies: n_hidden_copies, d_model: d_model } }
      norm:          { op: rmsnorm, in: hc_exit, dim: d_model, weight_axes: [{ replicated: true }] }
      # DSparkMarkovHead (source/model.py:1077-1086): a rank-d_markov_rank
      # embedding of the previously drafted token and a head back to the vocab,
      # whose logits are ADDED to the shared head's logits each inner step.
      markov_head.embed: { op: embedding, in: input_ids, dims: { n_vocab: n_vocab, d_model: d_markov_rank }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
      markov_head.head:  { op: linear, in: markov_head.embed, dims: { in: d_markov_rank, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
      # DSparkConfidenceHead (source/model.py:1089-1097): `self.proj =
      # Linear(input_dim, 1)` over cat([hidden, markov_embed]) = 5120 + 256.
      # The checkpoint keeps the submodule: the key is
      # `mtp.2.confidence_head.proj.weight` [1, 5376], so the node carries
      # both segments. The table's width is bound at the call
      # (`d_model: d_markov_rank`), so its output axis is d_markov_rank and
      # sits beside the hidden's d_model in the concat as its own axis.
      conf_in:      { op: concat, in: [norm, markov_head.embed], dims: { in_a: d_model, in_b: d_markov_rank, out: "d_model + d_markov_rank" } }
      confidence_head.proj: { op: linear, in: conf_in, dims: { in: "d_model + d_markov_rank", out: "1" }, weight_axes: [{ replicated: true }, { replicated: true }] }
    outputs: [norm]

model_inputs:
  input_ids: { kind: tokens }
  pixel_values: { kind: image, axes: [n_img, img_h, img_w] }

model:
  # `h = self.embed(input_ids)` — ParallelEmbedding(vocab_size, dim), source/model.py:1201.
  - { name: embed, op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], inputs: [input_ids] }

  # Vision path — singleton wrapper, so its leaves keep the bare checkpoint
  # paths `vision.*` / `aligner.*` / `image_*`.
  - name: vision
    group: true
    aux_kind: vision
    layers:
      # `load_image` (source/image_processor.py:115-129): every processed side
      # is a multiple of patch_size (best = ceil(side / p) * p at :110-111, and
      # the shrunk side `floor(h * beta / p) * p` at :57), and the patch order is
      # (n_vit_h, n_vit_w) reading order with the channels-innermost flatten
      # `reshape(3, n_vit_h, p, n_vit_w, p).permute(1, 3, 0, 2, 4)` (:128) — the
      # 588-wide row `vision.patch_embed` consumes. Non-causal per image.
      - { name: vision.patchify, op: patchify, inputs: [pixel_values], dims: { patch: s_patch, temporal: "1", channels: n_vis_channels, align: s_patch }, segment: item, source_anchor: "source/image_processor.py:110-111 `best_width = math.ceil(width / p) * p` (every side a multiple of patch_size; :57 the resize-ratio side likewise); :128 the (n_h, n_w) reading-order patch flatten" }
      - { name: vision, template: dsv41_vision_tower, inputs: [vision.patchify] }

  # `merge_image_embeddings(images, h)` (source/model.py:1228-1239) overwrites
  # each image's token span in the embedding stream, in place, before the
  # hc expansion. The decoder reads only the merge.
  - { name: embed_merge, op: scatter_rows_replace, inputs: [embed, vision], prompt_slots: { domain: pixel_values, defines: true, source_anchor: "source/model.py:1231-1239 `merge_image_embeddings` writes the span rows (IMAGE_START/END, per-row IMAGE_NEW_LINE, IMAGE slots = aligner rows) into h in place; source/image_processor.py:132-137 `image_token_types` fixes every span position" } }

  # `h = h.unsqueeze(2).repeat(1, 1, self.hc_mult, 1)` (source/model.py:1258) —
  # a zero-param, zero-FLOP view replicate onto the HC copy axis.
  - { name: hc_expand, op: broadcast, axis: -2, dims: { width: n_hidden_copies }, inputs: [embed_merge] }
  # A block boundary is [B, s_ctx, <width>], so the copy axis cannot live on it:
  # the stack carries the widened stream FLATTENED, [B, s_ctx,
  # n_hidden_copies * d_model] — which is also the layout `hc_mixes` consumes
  # (`x = x.flatten(2)`, source/model.py:949). Each block re-exposes the copy
  # axis with `view_split` for the ops that reduce or mix across copies. Both
  # are views — zero params, zero FLOPs.
  - { name: hc_flat, op: view_merge, inputs: [hc_expand] }
  # `pre_mix = make_identity_pre_mix(h, self.hc_mult)` (source/model.py:1260,
  # defined :1159-1163): a one-hot on hidden copy 0, the mix layer 0's
  # attention reduce reads — the `seed` of the `hc_pre_mix` stream.
  - { name: hc_seed, op: one_hot, dims: { in: "n_hidden_copies * d_model", out: n_hidden_copies }, inputs: [hc_flat] }

  - name: layers
    inputs: [hc_flat, input_ids]
    repeat: n_layers
    streams:
      # The carried residual is the HC stream, n_hidden_copies copies wide:
      # `h = h.unsqueeze(2).repeat(1, 1, self.hc_mult, 1)` (source/model.py:1258)
      # happens before the loop and `h` keeps the copy axis until the exit
      # reduce after it (`hc_exit`).
      hidden: { carries: true }
      # Single-pass HC: a layer publishes its FFN sinkhorn's `pre` and the NEXT
      # layer's attention reduce consumes it (`return x, ffn_pre` /
      # `x = self.hc_pre(x, pre_mix)`). Before layer 0 the loop seeds it with
      # the parameter-free `make_identity_pre_mix` (source/model.py:1159-1163,
      # called at :1260): the stream's `seed`, `hc_seed`. Topology only: the
      # reduce itself is `hc_weighted_reduce` and carries no weight.
      hc_pre_mix:
        seed: hc_seed
        shape: [B, s_ctx, n_hidden_copies]
        src: "return x, ffn_pre   (Block.forward, source/model.py:994; consumed at :983 `x = self.hc_pre(x, pre_mix)`)"
      # CSA2 shared state published by `SharedAttentionRuntime`
      # (source/model.py:739-763): the compressed KV and the indexer keys of the
      # most recent kv_source layer.
      # The axis is `s_kv`, not `s_ctx`: these are cache rows, one per
      # compression group of ATTENDED keys, and `s_kv` is the key axis prefill
      # context parallelism leaves whole (dims.yaml:1131-1141) while `s_ctx` is
      # the token range a rank owns. A consumer unions this read with its own
      # 128-token window and scores both in one softmax, so writing the
      # compressed rows on the cp-divided axis would hand that score a key made
      # of two different cuts.
      compress_kv:
        shape: [B, "s_kv // compress_ratio", d_head]
        src: "source/model.py:748 `shared_attn.compress_kv = self.compress_kv_cache`  (read back by every consumer at :763 `return shared_attn.compress_kv[:bsz, :compress_len], idxs`)"
      index_k:
        shape: [B, "s_kv // compress_ratio", d_indexer_head]
        src: "source/model.py:548 `shared_attn.index_k = self.k_cache`  (consumed at :554 `index_k = shared_attn.index_k[:bsz, : end_pos // ratio]`)"
      # The candidate blocks, chosen once at the single
      # `candidate_source_layer_id` (20) and reused by every later index source:
      # `n_topk_blocks` block ids per query, as sglang publishes them
      # (`v41_indexer/sparse_table.py:174-230` publish_decode). The reference
      # expands them to an s_kv/ratio-wide mask (source/model.py:570); the
      # later layers here score only the candidates (sparse_table.py:303-323).
      candidates:
        shape: [B, s_ctx, "Min(n_topk_blocks, s_kv // compress_ratio // s_sparse_block)"]
        src: "source/model.py:570 `shared_attn.candidates = select_candidate_blocks(`  (consumed by every later index source at :575 `index_score = index_score.masked_fill(~shared_attn.candidates, -torch.inf)`)"
      # The chosen key ids, published by each index source and reused by the
      # layers between it and the next one.
      csa_topk:
        shape: [B, s_ctx, n_topk_keys]
        src: "source/model.py:736 `shared_attn.topk_idxs = idxs`  (consumed at :726 `return shared_attn.topk_idxs`)"
      # `main_hiddens.append(h.mean(dim=2))` for i in dspark_target_layer_ids
      # (source/model.py:1265-1266) — the tap is of the layer's INPUT, taken
      # before `layer(...)` runs, so it is the ENTRY of iterations 37/38/39 of
      # the carried stream (one appended stream per tap; the elementwise mean
      # over the hc copies is parameter-free and is computed by the consumer,
      # `blocks: dspark_stage_first`). The three taps concatenate
      # (`torch.cat(main_hiddens, dim=-1)`, :1271) into the 15360-wide input of
      # `mtp.0.main_proj`. `dspark_target_layer_ids` is a per-layer config list,
      # but `before:` takes iterations one stream at a time, so the three
      # indices are literals.
      main_hidden_37: { from: hidden, before: [37],
                        src: "source/model.py:1266 `main_hiddens.append(h.mean(dim=2))`  (i = 37 ∈ dspark_target_layer_ids, appended before layer 37 runs; concatenated at :1271 `main_hidden = torch.cat(main_hiddens, dim=-1)`)" }
      main_hidden_38: { from: hidden, before: [38],
                        src: "source/model.py:1266 `main_hiddens.append(h.mean(dim=2))`  (i = 38 ∈ dspark_target_layer_ids, appended before layer 38 runs; concatenated at :1271)" }
      main_hidden_39: { from: hidden, before: [39],
                        src: "source/model.py:1266 `main_hiddens.append(h.mean(dim=2))`  (i = 39 ∈ dspark_target_layer_ids, appended before layer 39 runs; concatenated at :1271)" }
    # Nine variants, from three orthogonal per-layer facts:
    #   compress_ratios[i]            -> 0 (SWA-only) / 2 / 1
    #   i in kv_source_layer_ids      -> owns a Compressor (+ wgate iff ratio > 1)
    #   i in index_source_layer_ids   -> owns an Indexer (and i == 20 the candidates)
    # plus two block-level facts: engram_layer_ids [1, 14] and
    # dspark_target_layer_ids [37, 38, 39]. Declaration order is first-wins, so
    # the explicit-index generators claim their layers before the `rest` sweeps.
    per_layer:
      assign:
        # compress_ratios[0:2] == [0, 0] — no compressor, no indexer, window only.
        # Every layer's attention reduce reads the PREVIOUS layer's ffn_pre
        # (`return x, ffn_pre` → `self.hc_pre(x, pre_mix)`); layer 0's
        # "previous" is the stream's `seed`, the `hc_seed` one-hot.
        - { type: swa,               layers: ["0"], reads_from: { hc_pre_mix: "i - 1" } }
        - { type: swa_engram,        layers: ["1"], reads_from: { hc_pre_mix: "i - 1" } }           # engram_layer_ids[0]
        # kv_source + index_source at ratio 2 (gated pooling over 2-token windows).
        - { type: csa_source_engram, layers: ["14"], reads_from: { hc_pre_mix: "i - 1" } }          # engram_layer_ids[1]
        - { type: csa_source,        layers: ["2", "8"], reads_from: { hc_pre_mix: "i - 1" } }
        # The one candidate_source_layer_id; ratio 1, so the compressor is the
        # bare `wkv` + `norm` branch (`if ratio == 1: return self.norm(self.wkv(x))`).
        - { type: csa_cand,          layers: ["20"], reads_from: { hc_pre_mix: "i - 1" } }
        # index_source only — the compressed KV and indexer keys are read from
        # the most recent kv_source's buffers, the candidates from the one
        # candidate_source_layer_id (SharedAttentionRuntime, source/model.py:739-789).
        - type: csa_reindex
          layers: ["24", "28", "32", "36"]
          reads_from:
            hc_pre_mix:  "i - 1"
            compress_kv: { nearest: { from: config.text_config.kv_source_layer_ids } }
            index_k:     { nearest: { from: config.text_config.kv_source_layer_ids } }
            candidates:  { nearest: { from: config.text_config.candidate_source_layer_id } }
        # Pure consumers. Ratio splits at layer 20 (compress_ratios). Each reads
        # the most recent kv_source's compressed KV and the most recent
        # index_source's top-K selection.
        - type: csa_reuse2
          range: ["3", "19"]
          reads_from:
            hc_pre_mix:  "i - 1"
            compress_kv: { nearest: { from: config.text_config.kv_source_layer_ids } }
            csa_topk:    { nearest: { from: config.text_config.index_source_layer_ids } }
        - type: csa_reuse1
          rest: true
          reads_from:
            hc_pre_mix:  "i - 1"
            compress_kv: { nearest: { from: config.text_config.kv_source_layer_ids } }
            csa_topk:    { nearest: { from: config.text_config.index_source_layer_ids } }
      map:
        swa:               { template: dsv41_hc_block, params: { attn: dsv4_swa_only_attention, ffn: dsv41_moe_vl } }
        swa_engram:        { template: dsv41_hc_block_engram, params: { attn: dsv4_swa_only_attention, ffn: dsv41_moe_vl }, dims: { n_vocab: n_engram_rows_a } }
        # kv + index source at ratio 2: the gated-pooling compressor and the
        # indexer that owns the shared index keys.
        csa_source:
          template: dsv41_hc_block
          dims: { compress_ratio: compress_ratio_source }
          params:
            ffn: dsv41_moe_vl
            attn:
              template: csa2_attention
              params:
                compressor: csa2_compressor_gated
                indexer:    csa2_indexer
                compressed: csa2_compress_store
        csa_source_engram:
          template: dsv41_hc_block_engram
          dims: { compress_ratio: compress_ratio_source, n_vocab: n_engram_rows_b }
          params:
            ffn: dsv41_moe_vl
            attn:
              template: csa2_attention
              params:
                compressor: csa2_compressor_gated
                indexer:    csa2_indexer
                compressed: csa2_compress_store
        # Layer 20: ratio 1, so the compressor takes its plain branch (no
        # `wgate`), and it is the one `candidate_source_layer_id`.
        csa_cand:
          template: dsv41_hc_block
          params:
            ffn: dsv41_moe_vl
            attn:
              template: csa2_attention
              params:
                compressor: csa2_compressor_plain
                indexer:    csa2_indexer_candidate_source
                compressed: csa2_compress_store
        # Index source only: no compressor and no index keys of its own — it
        # re-scores the shared keys inside layer 20's candidate blocks.
        csa_reindex:
          template: dsv41_hc_block
          params:
            ffn: dsv41_moe_vl
            attn:
              template: csa2_attention
              params:
                compressor: csa2_shared_latent
                indexer:    csa2_indexer_shared_keys
                compressed: csa2_compress_borrowed
        # Pure consumers: the shared compressed KV under the shared top-K.
        # Same body and bindings at ratio 2 (layers 3-19) and ratio 1
        # (layers 21-39); the two invocations are told apart by that dim
        # (`…[compress_ratio=2]` / `…[compress_ratio=1]`), each with its own
        # layers' weights.
        csa_reuse2:
          template: dsv41_hc_block
          dims: { compress_ratio: compress_ratio_source }
          params:
            ffn: dsv41_moe_vl
            attn:
              template: csa2_attention
              params:
                compressor: csa2_shared_latent
                indexer:    csa2_shared_selection
                compressed: csa2_compress_borrowed
        csa_reuse1:
          template: dsv41_hc_block
          params:
            ffn: dsv41_moe_vl
            attn:
              template: csa2_attention
              params:
                compressor: csa2_shared_latent
                indexer:    csa2_shared_selection
                compressed: csa2_compress_borrowed

  # `h = layer.hc_pre(h, pre_mix)` (source/model.py:1268) runs after the loop
  # with the `pre_mix` the last layer returned — layer 39's own `ffn_pre`, the
  # final value of the `hc_pre_mix` stream. Parameter-free, which is why V4.1,
  # unlike V4-Pro, has no `hc_head_fn/base/scale` tensors in the checkpoint.
  # The copy axis comes back out of the flattened carried stream first.
  - { name: hc_unflat, op: view_split, axis: -1, dims: { n_heads: n_hidden_copies, d_head: d_model }, inputs: [layers] }
  - { name: hc_exit, op: hc_weighted_reduce, dims: { n_hidden_copies: n_hidden_copies, d_model: d_model }, inputs: [hc_unflat, hc_pre_mix] }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }], inputs: [hc_exit] }
  # `ParallelHead` (source/model.py:997-1017): `F.linear(x.float(), self.weight)`,
  # no bias; `tie_word_embeddings: false`, and `head.weight` is its own tensor.
  - { name: head, op: linear, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], inputs: [norm] }

  # `forward_embed` (source/model.py:1131-1141): the draft block is
  # `dspark_block_size` noise tokens looked up in the SHARED embed table and
  # widened onto the HC copy axis. Zero params.
  - { name: mtp_hc_expand, op: broadcast, axis: -2, dims: { width: n_hidden_copies }, inputs: [embed] }
  # Same flattened carrying convention as the backbone's `hc_flat`.
  - { name: mtp_hc_flat, op: view_merge, inputs: [mtp_hc_expand] }
  # `pre_mix = make_identity_pre_mix(h, self.hc_mult)` (source/model.py:1277):
  # the MTP loop's own seed, the `seed` of `mtp_hc_pre_mix`.
  - { name: mtp_hc_seed, op: one_hot, dims: { in: "n_hidden_copies * d_model", out: n_hidden_copies }, inputs: [mtp_hc_flat] }

  - name: mtp
    group: true
    aux_kind: mtp
    checkpoint: { prefix: mtp, index: local }
    inputs: [mtp_hc_flat]
    layers:
      - name: mtp
        inputs: [mtp_hc_flat, input_ids]
        repeat: n_mtp_layers
        streams:
          hidden: { carries: true }
          # `hc_pre_mix` is re-seeded by the MTP loop with
          # `make_identity_pre_mix(h, self.hc_mult)` (source/model.py:1277) and
          # threaded through the stages exactly as in the backbone (:1278-1279):
          # stage 0 reads the seed (`seed`), stages 1/2 read it from the stage
          # before, and every stage `stream_out`s its own ffn_pre.
          # Named `mtp_hc_pre_mix`, not the backbone's `hc_pre_mix`: stream
          # names are stack-local, and a name two stacks declare cannot be
          # attributed to one of them when a component is evaluated alone.
          # No `shape:` publish-gate here or on `main_x`: stage 0, their
          # producer, reads the appended main_hidden_* streams, which an
          # isolated per-variant evaluation cannot seed.
          mtp_hc_pre_mix:
            seed: mtp_hc_seed
            src: "source/model.py:1278-1279 `h, pre_mix = self.mtp[i](h, ..., pre_mix)`  (the Block.forward `return x, ffn_pre` of :994, consumed at :983 `x = self.hc_pre(x, pre_mix)`)"
          # `main_x` is built once by stage 0 and passed to every stage's attention.
          main_x:
            src: "source/model.py:1276 `h, main_x = self.mtp[0].forward_embed(main_hidden, input_ids)`  (built at :1130 `main_x = self.main_norm(self.main_proj(main_hidden))`)"
          # The backbone's three tap streams; stage 0 reads element 0 of each
          # (the only element) at an inner node.
          main_hidden_37: { read: each }
          main_hidden_38: { read: each }
          main_hidden_39: { read: each }
        per_layer:
          assign:
            - { type: first, layers: ["0"], reads_from: { mtp_hc_pre_mix: "i - 1" } }
            - { type: last,  layers: ["2"], reads_from: { mtp_hc_pre_mix: "i - 1", main_x: "0" } }   # n_mtp_layers - 1
            - { type: mid,   rest: true,    reads_from: { mtp_hc_pre_mix: "i - 1", main_x: "0" } }
          map:
            first: { template: dspark_stage_first }
            mid:   { template: dspark_stage_mid }
            last:  { template: dspark_stage_last }
      # `logits = self.head(self.norm(x), full_logits=True)` (source/model.py:1148)
      # — `self.head` IS the backbone's ParallelHead (`self.mtp[-1].head =
      # self.head`, source/model.py:1213), so there is no `mtp.X.head.weight` in
      # the checkpoint. Only the last stage runs `forward_head` (:1282).
      - { name: mtp_logits, op: linear, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: head }, inputs: [mtp] }

# Quantization. `quantization_config` is `{quant_method: fp8, scale_fmt: ue8m0,
# weight_block_size: [32, 32], expert_dtype: fp4}` — note the 32x32 blocks,
# a quarter of the V4 128x128 tile, so the `.scale` companion of every
# quantized tensor is 16x larger than in the V3/V4 checkpoints.
#
# `quant_pattern_counts` (snapshot:2378-2404) is the exact list of what ships
# quantized; everything absent from it is BF16 or F32 on disk:
#   fp8 (F8_E4M3 + F8_E8M0 scale): attn.{wq_a,wq_b,wo_a,wkv,wo_b},
#       ffn.shared_experts.w{1,3,2}, engram.{embed,wkv}, indexer.wq_b, main_proj
#   fp4 (I8-packed, 2 values/byte + per-32 scale): ffn.experts.X.w{1,3,2}
#   NOT quantized: all norms, all HC banks (F32), attn_sink (F32), gate.weight
#       (BF16), gate.bias / gate.bias_vl (F32), the compressor, the indexer's
#       weights_proj / wk / k_norm, engram.q_weight / k_weight, embed, norm,
#       head, markov_head, confidence_head, and the whole vision path.
quant_context:
  # What the reference forward stores each per-token cache slot at. Every
  # write is quantised in place before it lands in a BF16 buffer, so the
  # buffer's dtype is a container and the stored values are the quantised
  # ones:
  #   kv — `act_quant(kv, fp8_block_size, scale_fmt, scale_dtype, True)`
  #     (source/model.py:707, the DSpark window at :1042/:1062): FP8 over 32
  #     channels with an E8M0 scale, "RoPE tail included".
  #   compressed_kv — `fp4_act_quant(latent, 16, True,
  #     scale_dtype=torch.float8_e4m3fn)` (:760): NVFP4.
  #   index_key — `fp4_act_quant(k, fp4_block_size, True)` (:546): MXFP4.
  cache_formats:
    kv:            fp8_ue8m0_group32
    compressed_kv: nvfp4
    index_key:     mxfp4
  per_role:
    attention:     { method: fp8_ue8m0, block_h: 32, block_w: 32 }
    attention_swa: { method: fp8_ue8m0, block_h: 32, block_w: 32 }
    ffn_dense:     { method: fp8_ue8m0, block_h: 32, block_w: 32 }
    # `act_group: 32` is this repo's own activation block: the FP4 experts'
    # matmul quantises its activation to FP8 over 32 channels
    # (`fp8_block_size = 32`, source/model.py:27, used at :186-195), where
    # V4's reference quantises over 128.
    # MXFP4, not the generic FP4: E2M1 under one UE8M0 exponent per 32 is
    # the OCP Microscaling recipe — owner's ruling, and the recipe agrees.
    # Declared per model rather than inferred from the scale and the group;
    # the scheme is `fp4`'s layout with the MX numeric format, so the bytes
    # are the same and only the measurement identity moves. `act_group: 32`
    # is still this checkpoint's own activation block (`fp8_block_size`).
    ffn_moe:       { method: mxfp4-dot-suffix, group_size: 32, act_group: 32 }
    router:        { method: none }
    # The six Hyper-Connection banks are created under
    # `with set_dtype(torch.float32)` (source/model.py:940-946).
    hyper_connection: { method: none, dtype: F32 }
    default:       { method: none }
  default_dtype: BF16
  overrides:
    # ---- F32 parameter banks ----
    # `attn_sink = nn.Parameter(torch.empty(n_local_heads, dtype=torch.float32))`
    # (source/model.py:641).
    - tensors_re: '\.attn\.attn_sink$'
      dtype: F32
    # Both MoE correction biases are F32 (source/model.py:806-807).
    - tensors_re: '\.ffn\.gate\.bias(?:_vl)?$'
      dtype: F32

    # ---- attention-roled tensors that are NOT quantized ----
    - tensors_re: '\.attn\.(?:q_norm|kv_norm)\.weight$'
      dtype: BF16
    # The Compressor's projections and norm (source/model.py:429-485).
    - tensors_re: '\.attn\.compressor\.(?:wkv|wgate|norm)\.weight$'
      dtype: BF16
    # The Indexer keeps only wq_b in fp8; weights_proj / wk / k_norm are BF16
    # (quant_pattern_counts has `indexer.wq_b.scale` and nothing else).
    - tensors_re: '\.attn\.indexer\.(?:weights_proj|wk|k_norm)\.weight$'
      dtype: BF16

    # ---- ffn_moe-roled tensors that are fp8, not fp4 ----
    # The single shared expert per layer ships F8_E4M3 like the attention.
    - tensors_re: '\.ffn\.shared_experts\.w[123]\.weight$'
      dtype: F8_E4M3
      method: fp8_ue8m0
      block_h: 32
      block_w: 32

    # ---- Engram ----
    # The n-gram table is fp8 with PER-ROW scales: `engram.embed.scale` is
    # [rows, 8] = [rows, 256 / 32] (snapshot:1138-1164), i.e. 1x32 blocks, not 32x32.
    - tensors_re: '\.engram\.embed\.weight$'
      dtype: F8_E4M3
      method: fp8_ue8m0
      block_h: 1
      block_w: 32
    - tensors_re: '\.engram\.wkv\.weight$'
      dtype: F8_E4M3
      method: fp8_ue8m0
      block_h: 32
      block_w: 32

    # ---- DSpark MTP ----
    # `main_proj` is the one fp8 tensor outside attn/ffn (`mtp.0.main_proj.scale`).
    - tensors_re: '^mtp\.(?:\d+|X)\.main_proj\.weight$'
      dtype: F8_E4M3
      method: fp8_ue8m0
      block_h: 32
      block_w: 32
    - tensors_re: '^mtp\.(?:\d+|X)\.(?:main_norm|norm)\.weight$'
      dtype: BF16
    - tensors_re: '^mtp\.(?:\d+|X)\.(?:markov_head\.(?:embed|head)|confidence_head\.proj)\.weight$'
      dtype: BF16

    # ---- vision path: entirely BF16 (no .scale companion anywhere) ----
    - tensors_re: '^vision\.'
      dtype: BF16
    - tensors_re: '^aligner\.'
      dtype: BF16
    - tensors_re: '^image_(?:start|end|newline)$'
      dtype: BF16
