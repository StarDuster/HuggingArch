# Identity file for XiaomiMiMo/MiMo-V2.6-Pro-RL.
#
# The MiMo-V2.5 architecture at a larger size: the same model_type
# (`mimo_v2`, MiMoV2ForCausalLM), the same modeling_mimo_v2.py, the same
# vision and audio towers (vision_config / audio_config differ only in
# `out_hidden_size`, which is the text hidden size). Every dim reads the
# config, so the family spec covers it. What differs is the checkpoint's
# quantization and the RoPE config's spelling.
base: mimo_v2_5
match:
  model_id: [XiaomiMiMo/MiMo-V2.6-Pro-RL]

# The config publishes RoPE as `rope_parameters` (rope_scaling is null).
view:
  hidden_act: config.hidden_act
  norm.eps: config.layernorm_epsilon
  rope_theta: config.rope_theta
  swa.head_dim: config.swa_head_dim
  swa.num_heads: config.swa_num_attention_heads
  swa.v_head_dim: config.swa_v_head_dim
  swa.rope_theta: config.swa_rope_theta

# FP8-E4M3 + per-128x128-tile F32 scale for the backbone; the routed experts
# are stored MXFP4 (`store_dtype: mxfp4`). Every fused qkv_proj (both
# attention classes: num_key_value_heads == swa_num_key_value_heads == 8) is
# blocked per segment, each ceil-padded on its own, with the K segment
# blocked per head. Vision tower, audio encoder and speech embeddings stay
# BF16; e_score_correction_bias is F32.
quant_context:
  default_dtype: BF16
  overrides: [{dtype: BF16, tensors_re: ^audio_encoder\.}, {dtype: BF16, tensors_re: ^visual\.},
    {dtype: BF16, tensors_re: ^speech_embeddings\.},
    {block_h: 128, block_w: 128, dtype: F8_E4M3, method: fp8, scale_shape: [((n_heads
          * d_head + block_h - 1) // block_h) + n_kv_heads * ((d_head + block_h -
          1) // block_h) + ((n_kv_heads * d_v_head + block_h - 1) // block_h), (in
          + block_w - 1) // block_w], tensors_re: \.qkv_proj\.weight$},
    {dtype: F32, tensors_re: mlp\.gate\.e_score_correction_bias$}]
  per_role:
    attention:
      block_h: 128
      block_w: 128
      method: fp8
    attention_swa:
      block_h: 128
      block_w: 128
      method: fp8
    # o_proj is BF16 in main + MTP (quantization_config.ignored_layers).
    attention_output:
      method: none
    default:
      method: none
    ffn_dense:
      block_h: 128
      block_w: 128
      method: fp8
    # vLLM Fp8Config(store_dtype="mxfp4") -> Mxfp4MoEMethod: MXFP4 experts
    # stored as `.weight` (U8, two values per byte) + `.weight_scale` (U8
    # UE8M0, one per 32 inputs), the scheme's `plain` variant.
    ffn_moe:
      format: plain
      group_size: 32
      method: mxfp4-pack-quantized
      # The config is a FineGrainedFP8 one that only STORES these experts
      # MXFP4 (`quant_method: fp8`, `store_dtype: mxfp4`), so the matmul is
      # the FP8 dispatcher's: an FP4-packed weight takes an FP8 activation
      # quantised over 32 channels.
      input_activations: fp8_dynamic_group32
    router:
      method: none
