# NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
#
# Hybrid Mamba-2 + Transformer + MoE architecture (NemotronHForCausalLM family).
# 52 backbone layers split into three mixer types per config.hybrid_override_pattern
# ("MEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEMEM*EMEMEMEME"):
#   M = 23 mamba layers      -> NemotronHMamba2Mixer
#                               (n_ssm_heads=64, d_ssm_head=64, n_ssm_groups=8, d_ssm_state=128)
#   * =  6 attention layers  -> plain GQA (n_heads=32, n_kv_heads=2, d_head=128, no QK-norm)
#                               with NO positional encoding: gqa_nope_attention
#   E = 23 moe layers        -> non-gated relu2 MoE (n_experts=128, n_experts_active=6,
#                               d_ffn_expert=1856, wide shared expert d_ffn_shared=3712)
#
# Unlike Nemotron-3-Ultra, this checkpoint has NO moe_latent_size, so the MoE
# routed experts run directly in hidden space d_model (no fc1/fc2 latent proj),
# and there is NO MTP head (no mtp.* tensors, no num_nextn_predict_layers).
#
# All backbone layers share the same single-norm wrapper (NemotronHBlock.forward):
#   residual = x;  x = norm(x);  x = mixer(x);  x = residual + x
# This differs from the standard pre_norm block (which has two norms), so we
# declare inline blocks rather than the auto-generated pre_norm templates.

match:
  model_type: [nemotron_h]
  model_id: ["nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"]

dims:
  s_max: config.max_position_embeddings   # published context length
  # --- Backbone ---
  d_model:    config.hidden_size                                # 2688
  n_heads:    config.num_attention_heads                        # 32
  n_kv_heads:   config.num_key_value_heads                        # 2
  d_head:    config.head_dim                                    # 128
  n_vocab:    config.vocab_size                                 # 131072
  n_layers:    config.num_hidden_layers                         # 52

  # --- Mamba-2 ---
  n_ssm_heads:  config.mamba_num_heads                           # 64
  d_ssm_head:  config.mamba_head_dim                             # 64
  n_ssm_groups:  config.n_groups                                 # 8
  d_ssm_state:  config.ssm_state_size                            # 128
  s_ssm_conv_kernel:  config.conv_kernel                         # 4

  # --- MoE ---
  n_experts:    config.n_routed_experts                          # 128
  n_experts_active:    config.num_experts_per_tok                # 6
  # Fallbacks are the config class's own defaults (NemotronHConfig: n_group = topk_group = 1).
  n_expert_groups:   config.n_group ?? "1"                       # 1
  n_groups_active:   config.topk_group ?? "1"        # 1
  d_ffn_expert:   config.moe_intermediate_size                   # 1856 (per-expert intermediate, hidden space)
  d_ffn_shared:   config.moe_shared_expert_intermediate_size     # 3712 (wide shared expert intermediate)

# Each NemotronHBlock is a SINGLE-norm wrapper: norm -> mixer -> +residual.
blocks:
  nemotron_attention_block:
    graph:
      norm:  { op: rmsnorm, in: x, dim: d_model, weight_axes: [{ replicated: true }] }
      mixer: { op: gqa_nope_attention, in: norm }
      out:   { op: add, in: [x, mixer], dim: d_model }
    outputs: [out]

  nemotron_mamba_block:
    graph:
      norm:  { op: rmsnorm, in: x, dim: d_model, weight_axes: [{ replicated: true }] }
      mixer: { op: nemotron_h_mamba_mixer, in: norm }
      out:   { op: add, in: [x, mixer], dim: d_model }
    outputs: [out]

  nemotron_moe_block:
    graph:
      norm:  { op: rmsnorm, in: x, dim: d_model, weight_axes: [{ replicated: true }] }
      mixer: { op: moe_ffn_relu2_shared, in: norm }
      out:   { op: add, in: [x, mixer], dim: d_model }
    outputs: [out]

model_inputs:
  input_ids: { kind: tokens }

model:
  - { name: backbone.embeddings, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: backbone.layers
    inputs: [backbone.embeddings]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        # 6 attention layers ('*' in hybrid_override_pattern).
        - { type: attn,  layers: ["5", "12", "19", "26", "33", "42"] }
        # 23 mamba layers ('M' in hybrid_override_pattern).
        - { type: mamba, layers: ["0", "2", "4", "7", "9", "11", "14", "16", "18", "21", "23", "25", "28", "30", "32", "35", "37", "39", "41", "44", "46", "48", "50"] }
        # Remaining 23 are MoE layers ('E' in hybrid_override_pattern).
        - { type: moe,   rest: true }
      map:
        attn:  { template: nemotron_attention_block }
        mamba: { template: nemotron_mamba_block }
        moe:   { template: nemotron_moe_block }
  - { name: backbone.norm_f, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [backbone.layers]}
  - { name: lm_head, op: linear, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] , inputs: [backbone.norm_f]}

# All weights BF16. The router's correction bias (*.gate.e_score_correction_bias)
# is kept F32 per _keep_in_fp32_modules_strict in modeling_nemotron_h.py.
quant_context:
  per_role:
    default: { method: none }
  default_dtype: BF16
  overrides:
    - tensors_re: '\.gate\.e_score_correction_bias$'
      dtype: F32
    # Mamba SSM state parameters A_log and D ship as F32 on disk
    # (dt_bias stays BF16). See checkpoint tensor dtypes.
    - tensors_re: '\.mixer\.A_log$'
      dtype: F32
    - tensors_re: '\.mixer\.D$'
      dtype: F32
