# Hunyuan-V3 (Tencent, hy_v3). ~299B total MoE.
# Homogeneous GQA + QK-norm attention across every layer (n_heads=64, n_kv_heads=8,
# d_head=head_dim=128, full RoPE, no QKV/o bias). Per-head q_norm/k_norm on d_head.
#
# Hybrid FFN: first_k_dense_replace=1 -> layer 0 is a dense SwiGLU
# (intermediate_size=13312); layers 1..79 are MoE (192 routed experts of
# moe_intermediate_size=1536, top-8, + 1 shared expert of the same width). Router is
# noaux-style: sigmoid + top-level `mlp.expert_bias` correction + route_norm
# + router_scaling_factor. No expert grouping (n_group absent).
#
# Auxiliary 1-layer MTP head stored inline at model.layers.80: parallel
# enorm/hnorm -> concat -> eh_proj -> [pre-norm GQA + MoE] -> final_layernorm.
# Shares the main embed_tokens + lm_head (no private copies).
#
# All weights BF16 (mlp.expert_bias is F32); not quantized -> no quant_context.
match:
  model_type: [hy_v3]

components:
  attention: gqa_qknorm_attention
  ffn_dense: swiglu_ffn
  ffn_moe: moe_ffn_router_expert_bias_shared
  norm: rmsnorm
  block: pre_norm

dims:
  d_model:    config.hidden_size
  n_heads:    config.num_attention_heads
  n_kv_heads:   config.num_key_value_heads
  d_head:    config.head_dim ?? "d_model // n_heads"
  d_ffn:    config.intermediate_size
  d_ffn_expert:   config.moe_intermediate_size
  n_vocab:    config.vocab_size
  n_layers:    config.num_hidden_layers
  n_experts:    config.num_experts
  n_experts_active:    config.num_experts_per_tok
  n_shared_experts:   config.num_shared_experts ?? "0"
  d_ffn_shared:   "d_ffn_expert * n_shared_experts"
  n_dense_layers:   config.first_k_dense_replace
  n_mtp_layers: config.num_nextn_predict_layers ?? "0"
  s_max: config.max_position_embeddings

view:
  rope_theta: config.rope_theta
  rope_scaling: config.rope_scaling
  hidden_act: config.hidden_act
  norm.eps: config.rms_norm_eps

blocks:
  # DeepSeek-style MTP layer (vLLM hy_v3_mtp.py): enorm normalizes the next
  # token's embedding from the shared embed_tokens, hnorm the previous hidden
  # state; eh_proj fuses the two.
  hy_v3_mtp_block:
    inputs: [x, inputs_embeds]
    graph:
      layer: { op: mtp_block_shared_head, in: [x, inputs_embeds], module: null,
               params: { inner: { template: pre_norm, params: { attn: gqa_qknorm_attention, ffn: moe_ffn_router_expert_bias_shared } } },
               inner_modules: { shared_head.norm: final_layernorm } }
    outputs: [layer]

model_inputs:
  input_ids: { kind: tokens }

# The transformers base model's tensors sit under `model.`; the LM head
# beside it declares its own path.
checkpoint: { root: model }

model:
  - { name: embed_tokens, inputs: [input_ids], op: embedding, boundary_role: input_embedding, dims: { n_vocab: n_vocab, d_model: d_model }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }] }
  - name: layers
    inputs: [embed_tokens]
    repeat: n_layers
    streams:
      hidden: { carries: true }
    per_layer:
      assign:
        - { type: dense, range: ["0", "n_dense_layers - 1"] }
        - { type: moe,   range: [n_dense_layers, "n_layers - 1"] }
      map:
        dense: { attention: gqa_qknorm_attention, ffn: swiglu_ffn }
        moe:   { attention: gqa_qknorm_attention, ffn: moe_ffn_router_expert_bias_shared }
  - { name: norm, op: rmsnorm, dim: d_model, weight_axes: [{ replicated: true }] , inputs: [layers]}
  - { name: lm_head, op: linear, checkpoint: { path: lm_head }, boundary_role: output_head, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: embed_tokens, when: config.tie_word_embeddings } , inputs: [norm]}
  - name: mtp
    group: true
    aux_kind: mtp
    # Stored as one more entry of the backbone's layer index space
    # (`model.layers.80.*` for 80 backbone layers), not under `mtp.`.
    checkpoint: { prefix: model.layers, index: { after: backbone } }
    inputs: [norm]
    layers:
      - { name: layers, repeat: n_mtp_layers, template: hy_v3_mtp_block , inputs: [norm, embed_tokens], streams: { hidden: { carries: true } }}
      # MTP logits use the main lm_head.weight, once per MTP layer (vLLM hy_v3_mtp.py compute_logits and load_weights).
      - { name: mtp_logits, op: linear, boundary_role: output_head, repeat: n_mtp_layers, dims: { in: d_model, out: n_vocab }, weight_axes: [{ world: attention, parts: n_vocab, fit: pad }, { replicated: true }], tied_weight: { to: lm_head } , inputs: [layers]}

# Not quantized — all weights are BF16. The only non-BF16 tensor is the MoE
# router's `mlp.expert_bias` correction vector, stored F32 on disk (like the
# DeepSeek-family noaux_tc router bias). Pin it so the on-disk byte count is
# exact; everything else stays BF16.
quant_context:
  per_role:
    default: { method: none }
  overrides:
    - tensors_re: 'mlp\.expert_bias$'
      dtype: F32
  default_dtype: BF16
