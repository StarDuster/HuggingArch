schema: huggingarch.claims/v1
subject: gqa_partial_rope_fused_qkv_attention
axioms:
  checks:
  - kind: kv_growth
    storage: per_token
    expect: n_kv_heads * (d_head + d_v_head)
    src: modeling_mimo_v2.py::MiMoV2Attention.forward `key_states = key_states.view(*input_shape,
      self.num_key_value_heads, self.head_dim).transpose(1, 2)` + `value_states =
      value_states.view(*input_shape, self.num_key_value_heads, self.v_head_dim).transpose(1,
      2)` (GQA, n_kv_heads KV heads)
