# ViT attention with a fused bare-Parameter QKV, biased out_proj and 2-D axial
# RoPE on q and k — Step-5's `EncoderVisionAttention`
# (inference/vision_encoder.py:184-265).
#
# Forward (:252-265):
#   qkv     = F.linear(x, in_proj_weight, in_proj_bias)   # bare Parameters
#   q, k, v = qkv.chunk(3, -1), each viewed as (heads, head_dim)
#   q, k    = self.rope(q, k, grid_hw)                    # use_rope2d, :261-262
#   o       = sdpa(q, k, v, is_causal=False, scale=head_dim**-0.5)
#   return out_proj(o)
#
# `perception_encoder_attention` is this component without the rotation
# (Step-3.7's tower). The 2-D RoPE is parameter-free — `freqs_cache` is a
# non-persistent buffer built from the patch grid (:76-78, :111-140) — so the
# two components have identical tensors and different functions, which is
# exactly the case a tensor-level reuse check cannot see: half of every head's
# channels rotate by the patch's column index and half by its row index
# (`freqs = cat([freqs_w, freqs_h], -1)`, :134-136, each half
# `repeat_interleave(2)`-paired, :126-128).
#
# `python -m backend.arch.component_reuse` on this file ranks
# `perception_encoder_attention` closest at 0.80 — this component plus the
# rotation, as the paragraph above says — and nothing else above 0.35. The
# rotation is the whole difference and it is not a `when:` switch away: a
# rotated head's channels pair across the half boundary, which changes which
# edge feeds the score.
#
# Required dims: d_vis_model, n_vis_heads, d_vis_head   (d_vis_model = n_vis_heads * d_vis_head)

role: attention
description: "ViT MHA: fused bare-Parameter biased QKV + 2-D axial RoPE on q/k + bidirectional score + biased out_proj."
cache:
  family: ViT
  entries:
    - { node: v_split, kind: kv }
graph:
  # `nn.Parameter(zeros(3 * hidden, hidden))` + `nn.Parameter(zeros(3 * hidden))`
  # applied through F.linear (:238-239, :253-257): stored as the bare
  # `in_proj_weight` / `in_proj_bias`, no `.weight` suffix.
  in_proj:      { op: linear, in: x, dims: { in: d_vis_model, out: "3 * n_vis_heads * d_vis_head", bias: "1" }, tensor_suffix: { weight: _weight, bias: _bias }, weight_axes: [{ segments: [{ segment: q, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }, { segment: k, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }, { segment: v, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }] }, { replicated: true }] }
  q_slice:      { op: slice, in: in_proj, dims: { in: "3 * n_vis_heads * d_vis_head", out: "n_vis_heads * d_vis_head" } }
  k_slice:      { op: slice, in: in_proj, dims: { in: "3 * n_vis_heads * d_vis_head", out: "n_vis_heads * d_vis_head" } }
  v_slice:      { op: slice, in: in_proj, dims: { in: "3 * n_vis_heads * d_vis_head", out: "n_vis_heads * d_vis_head" } }
  q_split_view: { op: view_split, in: q_slice, axis: -1, dims: { in: "n_vis_heads * d_vis_head", n_heads: n_vis_heads, d_head: d_vis_head } }
  q_split:      { op: transpose, in: q_split_view, axes: [0, 2, 1, 3] }
  k_split_view: { op: view_split, in: k_slice, axis: -1, dims: { in: "n_vis_heads * d_vis_head", n_heads: n_vis_heads, d_head: d_vis_head } }
  k_split:      { op: transpose, in: k_split_view, axes: [0, 2, 1, 3] }
  v_split_view: { op: view_split, in: v_slice, axis: -1, dims: { in: "n_vis_heads * d_vis_head", n_heads: n_vis_heads, d_head: d_vis_head } }
  v_split:      { op: transpose, in: v_split_view, axes: [0, 2, 1, 3] }
  # The whole head dim rotates: its first half reads the patch's column
  # index, its second half the row index (vision_encoder.py:111-140).
  q_rope:       { op: rope_2d, in: q_split, dims: { dim: d_vis_head } }
  k_rope:       { op: rope_2d, in: k_split, dims: { dim: d_vis_head } }
  # `is_causal=False` (:263): every patch sees every patch of its image.
  qk_score:     { op: attention_score, in: [q_rope, k_rope], dims: { is_causal: "0", n_heads: n_vis_heads, d_head: d_vis_head } }
  softmax:      { op: softmax, in: qk_score, dims: { is_causal: "0", n_heads: n_vis_heads } }
  apply:        { op: attention_apply, in: [softmax, v_split], dims: { is_causal: "0", n_heads: n_vis_heads, d_head: d_vis_head } }
  merge_t:      { op: transpose, in: apply, axes: [0, 2, 1, 3] }
  merge:        { op: view_merge, in: merge_t }
  out_proj:     { op: linear, in: merge, dims: { in: "n_vis_heads * d_vis_head", out: d_vis_model, bias: "1" }, weight_axes: [{ replicated: true }, { world: attention, parts: n_vis_heads, fit: replica_cells }] }
outputs: [out_proj]
