# A routed expert bank of SwiGLU FFNs whose clamps sit AFTER the activation —
# `gated_experts` with Step-5's `clamped_swiglu` (inference/model.py:1880-1899):
#
#   activated = silu(gate_proj[e] · x).clamp(max=limit)
#   bounded   = (up_proj[e] · x).clamp(-limit, limit)
#   y_e       = down_proj[e] · (activated * bounded)
#
# This is NOT `clamped_gated_experts` (DeepSeek-V4 / GLM-5.3), which clamps the
# PRE-activations: `silu(min(gate, limit))`. The two differ wherever the gate
# exceeds the limit — silu is monotone, so clamping its output at L is
# clamping its input at silu⁻¹(L), not at L — and the ordering is the point of
# Step-5's docstring: the gate has no lower clamp because silu already bounds
# it from below at about -0.28 (model.py:1881-1886).
#
# Every weight leads with the expert axis, `shape: [n_expert_copies, out, in]`,
# over the `[n_expert_copies, M, d_model]` dispatch buffer `permute` writes —
# the layout `_StackedExpertWeight` allocates (model.py:1937-1944) and the
# checkpoint stores (`moe.gate_proj.weight` [352, 1536, 4096]).
#
# Required dims: d_model, d_ffn (the expert width), n_expert_copies, clamp_limit.

role: ffn_moe
description: "Routed expert bank of SwiGLU FFNs clamped after the activation (silu then min, up two-sided), every weight [n_expert_copies, out, in]. Step-5 experts."
graph:
  gate_proj:  { op: linear, in: x, dims: { in: d_model, out: d_ffn }, shape: [n_expert_copies, d_ffn, d_model], weight_axes: [{ world: moe_copies, parts: n_expert_copies, fit: exact }, { world: moe_expert, parts: d_ffn, fit: exact }, { replicated: true }] }
  up_proj:    { op: linear, in: x, dims: { in: d_model, out: d_ffn }, shape: [n_expert_copies, d_ffn, d_model], weight_axes: [{ world: moe_copies, parts: n_expert_copies, fit: exact }, { world: moe_expert, parts: d_ffn, fit: exact }, { replicated: true }] }
  silu:       { op: silu, in: gate_proj, dim: d_ffn }
  silu_clamp: { op: clamp, in: silu, dim: d_ffn, formula: "y = min(silu(gate_proj · x), clamp_limit)   (one-sided: silu already bounds from below, model.py:1881-1886)" }
  up_clamp:   { op: clamp, in: up_proj, dim: d_ffn, formula: "y = min(max(up_proj · x, −clamp_limit), clamp_limit)" }
  gate_mul:   { op: mul, in: [silu_clamp, up_clamp], dim: d_ffn }
  down_proj:  { op: linear, in: gate_mul, dims: { in: d_ffn, out: d_model }, shape: [n_expert_copies, d_model, d_ffn], weight_axes: [{ world: moe_copies, parts: n_expert_copies, fit: exact }, { replicated: true }, { world: moe_expert, parts: d_ffn, fit: exact }] }
outputs: [down_proj]
