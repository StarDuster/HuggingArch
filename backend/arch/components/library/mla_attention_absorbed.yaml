# MLA Attention — absorbed (matrix-fused) form for decode-time analysis.
#
# Used by: DeepSeek-V3 / DSv3.1 / DSv3.2 / Kimi-K2 family at runtime
# under vLLM / SGLang / TRT-LLM, *for decode steps only*. Prefill still
# runs decompressed math (mla_attention.yaml). This component is the
# decode-side counterpart that the inference page binds when phase ==
# decode AND the model declares MLA.
#
# Algorithmic shape: K and V are kept in their compressed latent form
# (d_kv_lora + d_qk_rope = kv_lora_rank + qk_rope_head_dim) and the kv_b_proj weight
# is folded — its K-half (W_uk) gets pre-multiplied into Q's nope path,
# its V-half (W_uv) gets post-multiplied into the attention output.
# Result: QKᵀ contracts the latent dim d_kv_lora+d_qk_rope (not the full per-head d_qk_nope+d_qk_rope
# that decompressed mode contracts), and AV reads the latent V cache
# (d_kv_lora) instead of the per-head decompressed V (d_v_head).
#
# Why the asymmetry: decode is memory-bound, and the latent KV cache
# (d_kv_lora+d_qk_rope ≈ 576 elements/token) is ~57× smaller than the decompressed KV
# (n_heads·(d_qk_nope+d_v_head) ≈ 32K elements/token) for DeepSeek-V3. Trading a small
# amount of extra attention FLOPs for that bandwidth saving wins under
# `t_sol = max(F/Fp, B/Bp)`.
#
# What this means for the spec graph:
#   • kv_b_proj does NOT run as a linear here. It is still the one stored
#     tensor (`kv_b_proj: parameter_tensor`, the checkpoint's shape and
#     format), and the q_absorbed_nope + v_absorbed per_head_linear nodes
#     below run it per head: each declares `module: kv_b_proj`, holds
#     no tensor, and reads its half.
#   • k_latent and v_latent share storage (kv_a_layernorm output) since
#     in absorbed form V *is* the latent — there's no separate V cache.
#   • k_pe is broadcast to n_heads heads at attention time, same as
#     decompressed mode.
#
# Required dims: d_model, n_heads, d_qk_nope (qk_nope_head_dim), d_qk_rope (qk_rope_head_dim),
#                d_v_head (v_head_dim), d_kv_lora (kv_lora_rank), d_q_lora (q_lora_rank).
# Selection signal: phase == decode AND base spec uses mla_attention.

role: attention
description: "MLA decode-time absorbed form. KV cache held in latent (d_kv_lora+d_qk_rope); kv_b_proj folded into Q-side / O-side per-head matmuls."
cache:
  family: MLA
  entries:
    - { node: kv_a_layernorm, kind: latent }
    - { node: k_pe_rope, kind: rope_key }
graph:
  # --- Pre-attention path (identical to decompressed up through the
  #     latent KV computation; kv_b_proj is intentionally absent) ---
  q_a_proj:           { op: linear, in: x, dims: { in: d_model, out: d_q_lora }, weight_axes: [{ replicated: true }, { replicated: true }] }
  q_a_layernorm:      { op: rmsnorm, in: q_a_proj, dim: d_q_lora, weight_axes: [{ replicated: true }] }
  q_b_proj:
    op: linear
    in: q_a_layernorm
    dims: { in: d_q_lora, out: "n_heads * (d_qk_nope + d_qk_rope)" }
    weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }]
  q_split_heads:      { op: head_split, in: q_b_proj, dims: { n_heads: n_heads, d_head: "d_qk_nope + d_qk_rope" } }
  q_nope_slice:       { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_nope } }
  q_pe_slice:         { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_rope } }
  kv_a_proj_with_mqa: { op: linear, in: x, dims: { in: d_model, out: "d_kv_lora + d_qk_rope" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  kv_latent_slice:    { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_kv_lora } }
  k_pe_slice:         { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_qk_rope } }
  kv_a_layernorm:     { op: rmsnorm, in: kv_latent_slice, dim: d_kv_lora, weight_axes: [{ replicated: true }] }   # K_latent = V_latent (shared)
  q_pe_rope:          { op: rope, in: q_pe_slice, dim: d_qk_rope }
  k_pe_rope:          { op: rope_emb, in: k_pe_slice, dim: d_qk_rope }

  # --- Q-side: split into n_heads heads, then absorb W_uk per-head ---
  # W_uk per-head: d_qk_nope → d_kv_lora. Total params n_heads·d_qk_nope·d_kv_lora. This carries half of the
  # kv_b_proj checkpoint weight (the K-decoder slice).
  kv_b_proj:          { op: parameter_tensor, shape: ["n_heads * (d_qk_nope + d_v_head)", d_kv_lora], tensor_suffix: { weight: .weight }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }   # the stored kv_b_proj; the per-head GEMMs at its address (`module: kv_b_proj`) run it
  q_absorbed_nope:    { op: per_head_linear, module: kv_b_proj, in: q_nope_slice, dims: { n_heads: n_heads, in: d_qk_nope, out: d_kv_lora }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }, { replicated: true }] }   # (B, n_heads, s_query, d_kv_lora)
  # 4-D concat of (q_absorbed_nope, q_pe_split) along last axis: lets a
  # single attention_score do the QKᵀ in one matmul instead of two
  # smaller ones plus an elementwise add (which is shape-rank awkward
  # under our 3-D `add` primitive). Math is identical.
  q_concat:           { op: concat, in: [q_absorbed_nope, q_pe_rope], dims: { in_a: d_kv_lora, in_b: d_qk_rope, out: "d_kv_lora + d_qk_rope" } }

  # --- K-side: latent (d_kv_lora) and k_pe (d_qk_rope) both head-shared, broadcast to
  #     n_heads heads, then concat along last axis for the unified matmul ---
  # One KV head: the cached latent and RoPE key, joined once per position
  # (the 576-wide entry the sparse/dense MLA kernel reads, `num_heads_k=1`),
  # then shown to every query head as a zero-byte view. Joining before the
  # broadcast keeps one copy of each cached position, not n_heads.
  kv_concat:          { op: concat, in: [kv_a_layernorm, k_pe_rope], dims: { in_a: d_kv_lora, in_b: d_qk_rope, out: "d_kv_lora + d_qk_rope" } }   # (B, s_kv, d_kv_lora+d_qk_rope)
  k_concat:           { op: head_broadcast, in: kv_concat, dims: { n_heads: n_heads } }   # (B, n_heads, s_kv, d_kv_lora+d_qk_rope), a view
  k_latent_broadcast: { op: head_broadcast, in: kv_a_layernorm, dims: { n_heads: n_heads } }   # V == the latent, a view

  # --- QKᵀ in latent space (contraction dim = d_kv_lora + d_qk_rope) ---
  qk_score:           { op: attention_score, in: [q_concat, k_concat], dims: { n_heads: n_heads, d_head: "d_kv_lora + d_qk_rope" } }

  softmax:            { op: softmax, in: qk_score, dims: { n_heads: n_heads } }

  # --- AV in latent space: V == k_latent (shared storage in MLA absorbed) ---
  attn_apply_latent:  { op: attention_apply, in: [softmax, k_latent_broadcast], dims: { n_heads: n_heads, d_head: d_kv_lora } }   # (B, n_heads, s_query, d_kv_lora)

  # --- O-side: absorb W_uv per-head: d_kv_lora → d_v_head. Other half of kv_b_proj weight ---
  v_absorbed:         { op: per_head_linear, module: kv_b_proj, in: attn_apply_latent, dims: { n_heads: n_heads, in: d_kv_lora, out: d_v_head }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }, { replicated: true }] }     # (B, n_heads, s_query, d_v_head)

  # --- Standard tail: merge heads + final output projection ---
  o_merge_heads:      { op: head_merge, in: v_absorbed, dims: { n_heads: n_heads, d_head: d_v_head } }
  o_proj:             { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
