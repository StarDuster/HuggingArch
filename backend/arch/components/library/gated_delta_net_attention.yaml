# Gated DeltaNet Linear Attention (Qwen3.5 / FLA library variant)
# Used by: Qwen3.5-MoE on its `linear_attention` layer slot.
#
# Reference: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe
#   .Qwen3_5MoeGatedDeltaNet.forward — this decomposition follows that
#   forward step-by-step.
#
# Data flow:
#   x → in_proj_qkv  → split(Q | K | V)
#   x → in_proj_z    → z   (used inside RMSNormGated)
#   x → in_proj_a,b  → a, b  (small per-head signals used to compute g, β)
#   mixed_qkv = conv1d_depthwise(concat(Q,K,V))   # causal depthwise mixing
#   mixed_qkv → silu
#   (q, k, v) = split(mixed_qkv) and reshape to heads
#   q, k = l2norm(q), l2norm(k)                    # per key head
#   g  = -exp(A_log) · softplus(a + dt_bias)      # per-head forget gate
#   β  = sigmoid(b)                                # per-head update gate
#   o  = gated_delta_rule(q, k, v, g, β)           # recurrent state O(S); scales q by d_k^-0.5
#   o  = rmsnorm(o) · gate_act(z)                  # RMSNormGated (has dim-dim weight; norm before gate)
#   out = out_proj(o)
#
# Required dims:
#   d_model    — model hidden size
#   n_lin_k_heads  — number of key heads
#   d_lin_k_head  — per-head key dim
#   n_lin_v_heads  — number of value heads
#   d_lin_v_head  — per-head value dim
#   s_conv_kernel   — conv kernel size (e.g. 4)
#
# Params: gate_act (default silu) — the norm-gate activation; see the
#   RMSNormGated section below.
#
# All linear layers are bias-free in the Qwen3.5 implementation.

role: attention
description: "Gated DeltaNet linear attention. Qwen3.5-MoE non-full layers."
params:
  gate_act: { kind: component, default: silu, config: [output_gate_type] }
cache:
  family: GatedDeltaNet
  entries:
    # The delta-rule matrix S ∈ [n_lin_v_heads, d_k, d_v], carried by the scan,
    # as the HF forward allocates it (modeling_qwen3_5_moe.py:298, :346
    # `torch.zeros(batch_size, num_heads, k_head_dim, v_head_dim, ...)`) and
    # updates it (:361 `k_t.unsqueeze(-1) * delta.unsqueeze(-2)`).
    # F32: both recurrences cast q/k/v/β/g to float32 (:262, :334) and build
    # the state in that dtype (`.to(value)`, :300, :348), so the cached state
    # is F32 whether or not the config carries `mamba_ssm_dtype` (the Qwen3.5
    # configs that do declare `float32`). The conv state follows the model
    # dtype and stays on the deployment's.
    - { state: recurrent_state, kind: recurrent_state, carrier: delta_rule, shape: [n_lin_v_heads, d_lin_k_head, d_lin_v_head], dtype: "config.text_config.mamba_ssm_dtype ?? config.mamba_ssm_dtype ?? F32" }
    # The causal conv's window over q|k|v, [C, kernel_size], resolved in the
    # conv's own frame: the HF cache allocates `torch.zeros((*conv_states.shape[:-1],
    # conv_kernel_size))` and keeps the last `conv_kernel_size` columns
    # (transformers cache_utils.py:1033-1034, :1083).
    - { state: conv_state, kind: conv_state, carrier: conv1d, shape: [C, kernel_size] }
graph:
  # --- Input projections (no bias) ---
  in_proj_qkv:    { op: linear, in: x, dims: { in: d_model, out: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head" }, weight_axes: [{ segments: [{ segment: q, extent: "n_lin_k_heads * d_lin_k_head", world: attention, parts: n_lin_k_heads, fit: replica_cells }, { segment: k, extent: "n_lin_k_heads * d_lin_k_head", world: attention, parts: n_lin_k_heads, fit: replica_cells }, { segment: v, extent: "n_lin_v_heads * d_lin_v_head", world: attention, parts: n_lin_v_heads, fit: replica_cells }] }, { replicated: true }] }
  in_proj_z:      { op: linear, in: x, dims: { in: d_model, out: "n_lin_v_heads * d_lin_v_head" }, weight_axes: [{ world: attention, parts: n_lin_v_heads, fit: replica_cells }, { replicated: true }] }
  in_proj_a:      { op: linear, in: x, dims: { in: d_model, out: n_lin_v_heads }, weight_axes: [{ world: attention, parts: n_lin_v_heads, fit: replica_cells }, { replicated: true }] }
  in_proj_b:      { op: linear, in: x, dims: { in: d_model, out: n_lin_v_heads }, weight_axes: [{ world: attention, parts: n_lin_v_heads, fit: replica_cells }, { replicated: true }] }

  # --- Depthwise causal conv1d over the fused QKV ---
  # in_channels = out_channels = groups = conv_dim; no bias.
  conv1d:         { op: conv1d, in: in_proj_qkv,
                    dims: { C: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head",
                            C_in: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head",
                            C_out: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head",
                            kernel_size: s_conv_kernel,
                            dilation: "1",
                            groups: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head",
                            bias: "0" },
                    weight_axes: [{ segments: [{ segment: q, extent: "n_lin_k_heads * d_lin_k_head", world: attention, parts: n_lin_k_heads, fit: replica_cells }, { segment: k, extent: "n_lin_k_heads * d_lin_k_head", world: attention, parts: n_lin_k_heads, fit: replica_cells }, { segment: v, extent: "n_lin_v_heads * d_lin_v_head", world: attention, parts: n_lin_v_heads, fit: replica_cells }] }, { replicated: true }, { replicated: true }] }
  conv_silu:      { op: silu, in: conv1d,
                    dim: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head" }

  # --- Split into Q, K, V along the last dim ---
  # Offsets follow in_proj_qkv's segment order (q, k, v), which is
  # torch.split(mixed_qkv, [key_dim, key_dim, value_dim]) in the forward.
  q_slice:        { op: slice, in: conv_silu, dims: { in: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head", out: "n_lin_k_heads * d_lin_k_head", start: "0" } }
  k_slice:        { op: slice, in: conv_silu, dims: { in: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head", out: "n_lin_k_heads * d_lin_k_head", start: "n_lin_k_heads * d_lin_k_head" } }
  v_slice:        { op: slice, in: conv_silu, dims: { in: "2 * n_lin_k_heads * d_lin_k_head + n_lin_v_heads * d_lin_v_head", out: "n_lin_v_heads * d_lin_v_head", start: "2 * n_lin_k_heads * d_lin_k_head" } }

  q_split_heads_view:  { op: view_split, in: q_slice, axis: -1, dims: { in: "n_lin_k_heads * d_lin_k_head", n_heads: n_lin_k_heads, d_head: d_lin_k_head } }

  q_split_heads:  { op: transpose, in: q_split_heads_view, axes: [0, 2, 1, 3] }
  k_split_heads:      { op: head_split, in: k_slice, dims: { n_heads: n_lin_k_heads, d_head: d_lin_k_head } }
  v_split_heads:      { op: head_split, in: v_slice, dims: { n_heads: n_lin_v_heads, d_head: d_lin_v_head } }
  # --- q/k L2 normalization over each key head ---
  # The forward passes `use_qk_l2norm_in_kernel=True`, and the kernel entry
  # normalizes q and k before the recurrence (`l2norm(query)`,
  # `l2norm(key)` in torch_chunk_gated_delta_rule; `l2norm_fwd(q)`,
  # `l2norm_fwd(k)` in FLA's chunk_gated_delta_rule). It runs at the key head
  # count, before any broadcast to value heads, as vLLM and sglang run it.
  # The d_lin_k_head^-0.5 query scale that follows is part of `delta_rule`.
  q_l2norm:       { op: l2norm, in: q_split_heads, dim: d_lin_k_head }
  k_l2norm:       { op: l2norm, in: k_split_heads, dim: d_lin_k_head }
  # --- Per-head gate vectors ---
  # A_log and dt_bias are standalone learnable vectors of shape [n_lin_v_heads].
  # Both feed the `g` (forget) gate computation via the modeling formula:
  #   g = -exp(A_log) · softplus(a + dt_bias)
  A_log:          { op: parameter_vector, dim: n_lin_v_heads, weight_axes: [{ world: attention, parts: n_lin_v_heads, fit: replica_cells }] }
  dt_bias:        { op: parameter_vector, dim: n_lin_v_heads, weight_axes: [{ world: attention, parts: n_lin_v_heads, fit: replica_cells }] }
  a_plus_dt:      { op: add, in: [in_proj_a, dt_bias], dim: n_lin_v_heads }
  softplus_a:     { op: softplus, in: a_plus_dt, dim: n_lin_v_heads }
  neg_exp_A:      { op: neg_exp, in: A_log,  dim: n_lin_v_heads }
  g_gate:         { op: mul, in: [neg_exp_A, softplus_a], dim: n_lin_v_heads }
  # β = sigmoid(b_proj(x))
  beta:           { op: sigmoid, in: in_proj_b,  dim: n_lin_v_heads }

  # --- Core linear-attention recurrence (zero params) ---
  delta_rule:     { op: gated_delta_rule,
                    in: [q_l2norm, k_l2norm, v_split_heads, g_gate, beta] }

  # --- RMSNormGated(out, gate=z) + output projection ---
  # Norm first, then × gate_act(z) on each head of z (RMSNormGated reads the
  # gate per head, after z's split). transformers Qwen3.5 / Qwen3-Next fix the gate to
  # silu (Qwen3_5MoeRMSNormGated `self.activation = "silu"`) and read no
  # config field. vLLM (QwenGatedDeltaNetAttention) and sglang (Qwen3.5 /
  # Qwen3-Next GatedDeltaNet) build RMSNormGated with
  # `activation = config.output_gate_type`, silu when the field is absent,
  # "swish" = silu, and so do transformers models that expose the field
  # (Qwen4-Exp: `activation=config.output_gate_type or config.hidden_act`).
  # A config with `output_gate_type: sigmoid` binds `gate_act: sigmoid`
  # (`config: [output_gate_type]` on the param; validate refuses a binding
  # that disagrees with the config). The
  # field governs only this gate; the full-attention output gate is
  # sigmoid(gate) in every stack.
  z_split_heads:  { op: head_split, in: in_proj_z, dims: { n_heads: n_lin_v_heads, d_head: d_lin_v_head } }
  z_act:          { op: <gate_act>, in: z_split_heads, dim: d_lin_v_head }
  norm:           { op: rmsnorm, in: delta_rule, dim: d_lin_v_head, weight_axes: [{ replicated: true }] }
  norm_gated:     { op: mul, in: [norm, z_act], dim: d_lin_v_head }
  o_merge_heads:  { op: head_merge, in: norm_gated, dims: { n_heads: n_lin_v_heads, d_head: d_lin_v_head } }
  out_proj:       { op: linear, in: o_merge_heads, dims: { in: "n_lin_v_heads * d_lin_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_lin_v_heads, fit: replica_cells }] }
outputs: [out_proj]
