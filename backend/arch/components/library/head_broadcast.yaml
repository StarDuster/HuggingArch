# Head-broadcast: a 3-D `[B, s_ctx, dim]` tensor is fanned out across n_heads
# attention heads and laid out head-major.
#
#   [B, s_ctx, dim]   --broadcast(n_heads, axis=-1)-->   [B, s_ctx, n_heads, dim]
#                 --transpose-->               [B, n_heads, s_ctx, dim]
#
# Conceptually `repeat_kv` from the GQA/MQA literature, generalized:
# whenever a tensor has fewer head copies than the query side and
# needs to participate in attention math at full head count, this op
# materializes the head axis (memory-only — broadcast is a view, no
# FLOPs).
#
# Usages:
#   • MLA k_pe — checkpoint stores ONE shared rope-applied PE per
#     token, broadcast to all n_heads query heads at attention time.
#   • Absorbed MLA — the head-shared latent KV, broadcast to all heads.
# GQA / MQA K/V fan-out stays implicit inside attention_score's flop
# calculation.
#
# Required dims at call site: n_heads (target head count).

description: "Fan a [B, s_ctx, dim] tensor out to [B, n_heads, s_ctx, dim] via broadcast + transpose. Generic repeat_kv-style head fan-out."
graph:
  # axis=-2 places n_heads at position -2 of the rank-4 result:
  # [B, s_ctx, dim] (rank 3) → [B, s_ctx, n_heads, dim] (n_heads at result idx 2).
  expand:  { op: broadcast, in: x, dims: { width: n_heads }, axis: -2 }
  permute: { op: transpose, in: expand, axes: [0, 2, 1, 3] }
outputs: [permute]
