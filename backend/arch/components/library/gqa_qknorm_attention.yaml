# GQA Attention with QK RMSNorm (Qwen3 style)
# Used by: Qwen3, Qwen3-MoE
#
# Same as gqa_attention but adds per-head RMSNorm on Q and K after projection.
# q_norm and k_norm each have head_dim (d_head) parameters.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head
# Optional dims: Qb (QKV bias, 0=no bias, 1=has bias, default 0)

role: attention
description: "GQA + QK-RMSNorm before the score; no QKV bias. Qwen3, Gemma3."
# The rotation: `rope` (one position per token) unless the caller's model
# rotates by multimodal positions — `params: { rope: mrope }` when its rope
# parameters carry `mrope_section` (Qwen3-VL).
params:
  rope: { kind: component, default: rope }
cache:
  family: GQA
  entries:
    - { node: k_rope, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_heads * d_head", bias: Qb }
    weight_axes:
      - placement_by_symbol:
          n_heads: { world: attention, parts: n_heads, fit: replica_cells }
          n_vis_heads: { world: attention, parts: n_vis_heads, fit: replica_cells }
      - { replicated: true }
  k_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }
    weight_axes:
      - placement_by_symbol:
          n_kv_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
          n_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
          n_vis_kv_heads: { world: attention, parts: n_vis_kv_heads, fit: replica_cells }
          n_vis_heads: { world: attention, parts: n_vis_heads, fit: replica_cells }
      - { replicated: true }
  v_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }
    weight_axes:
      - placement_by_symbol:
          n_kv_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
          n_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
          n_vis_kv_heads: { world: attention, parts: n_vis_kv_heads, fit: replica_cells }
          n_vis_heads: { world: attention, parts: n_vis_heads, fit: replica_cells }
      - { replicated: true }
  q_split_heads:      { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:      { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_norm:          { op: rmsnorm, in: q_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  k_norm:          { op: rmsnorm, in: k_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  q_rope:          { op: <rope>, in: q_norm, dim: d_head }
  k_rope:          { op: <rope>, in: k_norm, dim: d_head }
  qk_score:        { op: attention_score, in: [q_rope, k_rope], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:
    op: linear
    in: o_merge_heads
    dims: { in: "n_heads * d_head", out: d_model }
    weight_axes:
      - { replicated: true }
      - placement_by_symbol:
          n_heads: { world: attention, parts: n_heads, fit: replica_cells }
          n_vis_heads: { world: attention, parts: n_vis_heads, fit: replica_cells }
outputs: [o_proj]
