# SWA + partial RoPE + asymmetric V head dim + per-head learnable sink
# The form without a V scale. MiMo-V2-Flash scales V (`attention_value_scale`)
# and binds `swa_partial_rope_sink_vscale_attention`.
#
# Same projection / partial-RoPE topology as
# `gqa_partial_rope_attention`, but the score / softmax / apply ops are
# the SWA variants (s_ctx × min(s_ctx, s_window) instead of s_ctx²) and a per-head
# `attention_sink_bias` parameter (shape [n_heads]) is concatenated onto the
# scores before softmax. Its parameter count is n_heads (one scalar per head).
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, d_v_head, d_rope, d_nope, s_window (d_rope + d_nope == d_head).
role: attention
description: "SWA + partial RoPE + asymmetric V head dim + per-head sink bias."
cache:
  family: SWA
  entries:
    - { node: key_concat, kind: kv }
    - { node: v_split_heads, kind: kv }
# K and V split over the attention TP world by KV head, whatever symbol the
# caller binds `n_kv_heads` to (MiMo-V2-Flash's windowed layers and MTP bind
# `flash_kv_shards` = swa_num_key_value_heads): vLLM mimo_v2.py MiMoV2Attention
# builds one QKVParallelLinear over `total_num_kv_heads` and keeps
# `num_kv_heads = total_num_kv_heads // tp_size` per rank (:242-243, :258),
# for the sliding branch (:376) and the MTP layer (mimo_v2_mtp.py:91) alike.
graph:
  q_proj:               { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:               { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:               { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_v_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:      { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:      { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_v_head } }
  q_pe_slice:           { op: slice, in: q_split_heads, dims: { in: d_head, out: d_rope } }
  q_nope_slice:         { op: slice, in: q_split_heads, dims: { in: d_head, out: d_nope } }
  k_pe_slice:           { op: slice, in: k_split_heads, dims: { in: d_head, out: d_rope } }
  k_nope_slice:         { op: slice, in: k_split_heads, dims: { in: d_head, out: d_nope } }
  q_pe_rope:            { op: rope_emb, in: q_pe_slice, dims: { dim: d_rope } }
  k_pe_rope:            { op: rope_emb, in: k_pe_slice, dims: { dim: d_rope } }
  query_concat:         { op: concat, in: [q_pe_rope, q_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  key_concat:           { op: concat, in: [k_pe_rope, k_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  qk_score:             { op: swa_attention_score, in: [query_concat, key_concat], dims: { n_heads: n_heads, d_head: d_head, s_window: s_window } }
  attention_sink_bias:  { op: parameter_vector, dim: n_heads, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }] }
  softmax:              { op: swa_softmax_with_sink, in: [qk_score, attention_sink_bias], dims: { n_heads: n_heads, s_window: s_window } }
  attn_apply:           { op: swa_attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_v_head, s_window: s_window } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_v_head } }
  o_proj:               { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
