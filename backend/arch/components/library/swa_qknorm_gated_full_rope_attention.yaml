# SWA + QK-RMSNorm + full RoPE + per-head gate attention
# Used by: Step-3.7-Flash (sliding-window layers).
# RoPE applied to the entire head_dim (no partial split). No k_pe concat
# onto o_proj input, so o_proj input is n_heads*d_head.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, s_window

role: attention
description: "SWA + QK-norm + full RoPE + headwise gate. Step-3.7-Flash sliding layers."
cache:
  family: SWA
  entries:
    - { node: k_rope, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  g_proj:          { op: linear, in: x, dims: { in: d_model, out: n_heads }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:   { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:   { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:   { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_norm:          { op: rmsnorm, in: q_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  k_norm:          { op: rmsnorm, in: k_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  q_rope:          { op: rope_emb, in: q_norm, dims: { dim: d_head } }
  k_rope:          { op: rope_emb, in: k_norm, dims: { dim: d_head } }
  qk_score:        { op: swa_attention_score, in: [q_rope, k_rope], dims: { n_heads: n_heads, d_head: d_head, s_window: s_window } }
  swa_softmax:     { op: swa_softmax, in: qk_score, dims: { n_heads: n_heads, s_window: s_window } }
  attn_apply:      { op: swa_attention_apply, in: [swa_softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head, s_window: s_window } }
  head_gate:       { op: headwise_gate, in: [attn_apply, g_proj], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:   { op: head_merge, in: head_gate, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
