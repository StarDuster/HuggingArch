# GQA + QK-RMSNorm + K=V Attention (no V projection)
# Used by: Gemma 4 (full_attention layers with attention_k_eq_v=true)
#
# What `attention_k_eq_v` saves is the v_proj WEIGHTS, not a cache entry.
# `Gemma4Attention.forward` (modeling_gemma4.py) reads
#
#     key_states   = self.k_proj(hidden_states).view(hidden_shape)
#     value_states = self.v_proj(...) if self.v_proj is not None else key_states
#     key_states   = apply_rotary_pos_emb(self.k_norm(key_states), ...)
#     value_states = self.v_norm(value_states)
#     key_states, value_states = past_key_values.update(key_states, value_states, ...)
#
# so V aliases k_proj's OUTPUT and then diverges: K carries k_norm and RoPE,
# V carries only the scale-free v_norm. Two different tensors reach `update`,
# and both are cached. Declaring one entry would cost the layer half its
# cache and leave the score's K read billed as activation, growing with
# cache_len because no stream owned it.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head

role: attention
description: "GQA + QK-norm where value reuses key states (k_eq_v). Gemma4 full-attn layers."
cache:
  family: GQA
  entries:
    - { node: k_rope, kind: kv }
    - { node: v_norm, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head" }, weight_axes: [{ placement_by_symbol: { n_heads: { world: attention, parts: n_heads, fit: replica_cells } } }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ placement_by_symbol: { n_kv_heads: { world: attention, parts: n_kv_heads, fit: replica_cells } } }, { replicated: true }] }
  q_split_heads:      { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_norm:          { op: rmsnorm, in: q_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  k_norm:          { op: rmsnorm, in: k_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  q_rope:          { op: rope, in: q_norm, dim: d_head }
  k_rope:          { op: rope, in: k_norm, dim: d_head }
  # `Gemma4RMSNorm(..., with_scale=False)` — a norm with no learnable weight.
  v_norm:          { op: rmsnorm_unscaled, in: k_split_heads, dim: d_head }
  qk_score:        { op: attention_score, in: [q_rope, k_rope], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_norm], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model }, weight_axes: [{ replicated: true }, { placement_by_symbol: { n_heads: { world: attention, parts: n_heads, fit: replica_cells } } }] }
outputs: [o_proj]
