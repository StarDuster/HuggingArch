# GQA + per-head QK-RMSNorm + partial RoPE, optional Q/K/V bias.
# Used by: MiniMax-M3 full-attention layers (layers 0-2, sparse_attention_freq==0);
# GLM-4.5 (with Qb = 1).
#
# Distinct from library components:
#   - gqa_qknorm_attention: has QK-norm but FULL RoPE (no partial split).
#   - gqa_partial_rope_attention: has partial RoPE but NO QK-norm.
#   - gqa_flat_qknorm_partial_rope_attention: QK-norm is FLAT (pre-view,
#     weight [n_heads*d_head]); MiniMax-M3 uses per_head QK-norm (weight [d_head]).
# This combines per-head QK-norm (applied after head_split, weight [d_head]) with
# partial RoPE (only the first d_rope of each head_dim is rotated).
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, d_rope, d_nope  (d_rope + d_nope == d_head)
# Optional dims: Qb (QKV bias, 0=no bias, 1=has bias, default 0); o_proj has no bias.
role: attention
description: "GQA + per-head QK-RMSNorm + partial RoPE + optional QKV bias. MiniMax-M3 full-attention layers, GLM-4.5."
cache:
  family: GQA
  entries:
    - { node: key_concat, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head", bias: Qb }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:   { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:   { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:   { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_norm:          { op: rmsnorm, in: q_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  k_norm:          { op: rmsnorm, in: k_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  q_pe_slice:      { op: slice, in: q_norm, dims: { in: d_head, out: d_rope } }
  q_nope_slice:    { op: slice, in: q_norm, dims: { in: d_head, out: d_nope } }
  k_pe_slice:      { op: slice, in: k_norm, dims: { in: d_head, out: d_rope } }
  k_nope_slice:    { op: slice, in: k_norm, dims: { in: d_head, out: d_nope } }
  q_pe_rope:       { op: rope_emb, in: q_pe_slice, dims: { dim: d_rope } }
  k_pe_rope:       { op: rope_emb, in: k_pe_slice, dims: { dim: d_rope } }
  query_concat:    { op: concat, in: [q_pe_rope, q_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  key_concat:      { op: concat, in: [k_pe_rope, k_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  qk_score:        { op: attention_score, in: [query_concat, key_concat], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:   { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
