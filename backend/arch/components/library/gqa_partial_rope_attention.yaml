# GQA + partial RoPE + asymmetric V head dim
# Used by: GLM-4.5-Air (with Qb = 1). MiMo-V2-Flash scales V
# (`attention_value_scale`) and binds `gqa_partial_rope_vscale_attention`.
#
# Structural differences vs `gqa_attention`:
#   - Partial RoPE: only the first d_rope dims of each head are rotated;
#     the trailing d_nope = d_head - d_rope dims pass through unchanged. d_rope == d_head
#     recovers standard full-head RoPE.
#   - Value head dim d_v_head may differ from key/query head dim d_head
#     (v_proj has shape [n_kv_heads * d_v_head]; o_proj reads [n_heads * d_v_head] → d_model).
#   - No QK-norm. Q/K/V bias is optional (Qb, default 0); o_proj has none.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, d_v_head, d_rope, d_nope (d_rope + d_nope == d_head).
# Optional dims: Qb (QKV bias, 0=no bias, 1=has bias, default 0)
role: attention
description: "GQA + partial RoPE + asymmetric V head dim (d_v_head may differ from d_head). GLM-4.5-Air (Qb=1)."
cache:
  family: GQA
  entries:
    - { node: key_concat, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head", bias: Qb }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_v_head", bias: Qb }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:      { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:      { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_v_head } }
  q_pe_slice:      { op: slice, in: q_split_heads, dims: { in: d_head, out: d_rope } }
  q_nope_slice:    { op: slice, in: q_split_heads, dims: { in: d_head, out: d_nope } }
  k_pe_slice:      { op: slice, in: k_split_heads, dims: { in: d_head, out: d_rope } }
  k_nope_slice:    { op: slice, in: k_split_heads, dims: { in: d_head, out: d_nope } }
  q_pe_rope:       { op: rope_emb, in: q_pe_slice, dims: { dim: d_rope } }
  k_pe_rope:       { op: rope_emb, in: k_pe_slice, dims: { dim: d_rope } }
  query_concat:    { op: concat, in: [q_pe_rope, q_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  key_concat:      { op: concat, in: [k_pe_rope, k_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  qk_score:        { op: attention_score, in: [query_concat, key_concat], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_v_head } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_v_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
