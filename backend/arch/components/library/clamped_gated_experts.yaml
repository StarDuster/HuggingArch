# A routed expert bank of SwiGLU FFNs with clamped pre-activations, one tensor
# per projection — `gated_experts` with DeepSeek-V4's clamps.
#
# Every weight leads with the expert axis, `shape: [n_expert_copies, out,
# in]`, over the `[n_expert_copies, M, d_model]` dispatch buffer (see
# `gated_experts`):
#
#   transformers `DeepseekV4Experts` (models/deepseek_v4/modeling_deepseek_v4.py:984)
#   gate = min(gate_proj[e] · x_e, limit);  up = clamp(up_proj[e] · x_e, ±limit)
#   y_e  = down_proj[e] · (silu(gate) * up)
#
# The clamps read `clamp_limit` (a `kind: constant` dim the model binds).
# Checkpoint encoding is the caller's `expert_weight:`; w1 / w3 / w2 naming
# its `inner_modules:`.
#
# Required dims: d_model, d_ffn (the expert width), n_expert_copies, clamp_limit.

role: ffn_moe
description: "Routed expert bank of SwiGLU FFNs with clamped pre-activations, every weight [n_expert_copies, out, in]. DeepSeek-V4 / V4.1, GLM-5.3 experts."
graph:
  gate_proj:  { op: linear, in: x, dims: { in: d_model, out: d_ffn }, shape: [n_expert_copies, d_ffn, d_model], weight_axes: [{ world: moe_copies, parts: n_expert_copies, fit: exact }, { world: moe_expert, parts: d_ffn, fit: exact }, { replicated: true }] }
  up_proj:    { op: linear, in: x, dims: { in: d_model, out: d_ffn }, shape: [n_expert_copies, d_ffn, d_model], weight_axes: [{ world: moe_copies, parts: n_expert_copies, fit: exact }, { world: moe_expert, parts: d_ffn, fit: exact }, { replicated: true }] }
  gate_clamp: { op: clamp, in: gate_proj, dim: d_ffn, formula: "y = min(gate_proj, clamp_limit)" }
  up_clamp:   { op: clamp, in: up_proj, dim: d_ffn, formula: "y = min(max(up_proj, −clamp_limit), clamp_limit)" }
  silu:       { op: silu, in: gate_clamp, dim: d_ffn }
  gate_mul:   { op: mul, in: [silu, up_clamp], dim: d_ffn }
  down_proj:  { op: linear, in: gate_mul, dims: { in: d_ffn, out: d_model }, shape: [n_expert_copies, d_model, d_ffn], weight_axes: [{ world: moe_copies, parts: n_expert_copies, fit: exact }, { replicated: true }, { world: moe_expert, parts: d_ffn, fit: exact }] }
outputs: [down_proj]
