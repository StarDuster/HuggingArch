# Kimi-K2.5 vision tower block (MoonViT-style ViT layer).
#
# Topology: post-norm with biased linear projections everywhere.
# layernorm → fused QKV (split into q/k/v slices) → split_heads → RoPE →
# attention → o_proj (biased linear) → +residual → layernorm →
# mlp.fc0 → gelu → mlp.fc1 → +residual.
#
# Required dims (must be bound in the calling spec's `dims:`):
#   d_vis_model  — vision hidden size
#   n_vis_heads  — vision attention heads
#   d_vis_head — vision head dim (= d_vis_model // n_vis_heads)
#   d_vis_ffn  — vision MLP intermediate
role: block
description: "Kimi-K2.5 MoonViT encoder layer: post-norm with biased QKV/proj projections + RoPE + GELU MLP."

graph:
  norm0:         { op: layernorm, in: x, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  wqkv:          { op: linear, in: norm0, dims: { in: d_vis_model, out: "3 * d_vis_model", bias: "1" }, weight_axes: [{ segments: [{ segment: q, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }, { segment: k, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }, { segment: v, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }] }, { replicated: true }] }
  q_flat:        { op: slice, in: wqkv, dims: { in: "3 * d_vis_model", out: d_vis_model, start: "0" } }
  k_flat:        { op: slice, in: wqkv, dims: { in: "3 * d_vis_model", out: d_vis_model, start: d_vis_model } }
  v_flat:        { op: slice, in: wqkv, dims: { in: "3 * d_vis_model", out: d_vis_model, start: "2 * d_vis_model" } }
  q_split_heads_view: { op: view_split, in: q_flat, axis: -1, dims: { in: d_vis_model, n_heads: n_vis_heads, d_head: d_vis_head } }
  q_split_heads: { op: transpose, in: q_split_heads_view, axes: [0, 2, 1, 3] }
  k_split_heads_view: { op: view_split, in: k_flat, axis: -1, dims: { in: d_vis_model, n_heads: n_vis_heads, d_head: d_vis_head } }
  k_split_heads: { op: transpose, in: k_split_heads_view, axes: [0, 2, 1, 3] }
  v_split_heads_view: { op: view_split, in: v_flat, axis: -1, dims: { in: d_vis_model, n_heads: n_vis_heads, d_head: d_vis_head } }
  v_split_heads: { op: transpose, in: v_split_heads_view, axes: [0, 2, 1, 3] }
  q_rope:        { op: rope_2d, in: q_split_heads, dim: d_vis_head }
  k_rope:        { op: rope_2d, in: k_split_heads, dim: d_vis_head }
  # Bidirectional: every query sees every key of its image (vLLM kimi_k25_vit.py:444,481-485 MMEncoderAttention, non-causal per image).
  qk_score:      { op: attention_score, in: [q_rope, k_rope], dims: { is_causal: "0", n_heads: n_vis_heads, d_head: d_vis_head } }
  softmax:       { op: softmax, in: qk_score, dims: { is_causal: "0", n_heads: n_vis_heads } }
  attn_apply:    { op: attention_apply, in: [softmax, v_split_heads], dims: { is_causal: "0", n_heads: n_vis_heads, d_head: d_vis_head } }
  o_merge_heads_t: { op: transpose, in: attn_apply, axes: [0, 2, 1, 3] }
  o_merge_heads: { op: view_merge, in: o_merge_heads_t }
  wo:            { op: linear, in: o_merge_heads, dims: { in: "n_vis_heads * d_vis_head", out: d_vis_model, bias: "1" }, weight_axes: [{ replicated: true }, { world: attention, parts: n_vis_heads, fit: replica_cells }] }
  attn_residual: { op: add, in: [x, wo], dim: d_vis_model }
  norm1:         { op: layernorm, in: attn_residual, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  mlp.fc0:       { op: linear, in: norm1, dims: { in: d_vis_model, out: d_vis_ffn, bias: "1" }, weight_axes: [{ world: dense_ffn, parts: d_vis_ffn, fit: exact }, { replicated: true }] }
  mlp.gelu:      { op: gelu, in: mlp.fc0, dim: d_vis_ffn }
  mlp.fc1:       { op: linear, in: mlp.gelu, dims: { in: d_vis_ffn, out: d_vis_model, bias: "1" }, weight_axes: [{ replicated: true }, { world: dense_ffn, parts: d_vis_ffn, fit: exact }] }
  out:           { op: add, in: [attn_residual, mlp.fc1], dim: d_vis_model }
outputs: [out]
