# MLA + DSA, decode-time ABSORBED form (DSv3.2 / GLM-MoE-DSA).
#
# The absorbed analog of `mla_dsa_attention`, exactly mirroring how
# `mla_attention_absorbed` is the absorbed analog of `mla_attention`. The
# decode-phase swap rebinds mla_dsa_attention → this (declared there as
# `decode_variant:`) so the sparse main attention reads the head-SHARED
# latent KV (MQA, one read across n_heads heads) instead of materialising per-head
# K/V from kv_b_proj, which would read V as [B, n_heads, s_kv, d_v_head] — an
# ×n_heads over-read.
#
# Structure (identical to mla_attention_absorbed up to the score) + the DSA
# indexer/top-K path grafted on:
#   • kv_b_proj is GONE; W_uk folds into the Q side (q_absorbed_nope: d_qk_nope→d_kv_lora) and
#     W_uv into the O side (v_absorbed: d_kv_lora→d_v_head) as per-head matmuls. Same weight,
#     reorganised — so weight accounting is unchanged.
#   • attention runs in latent space (contraction d_kv_lora+d_qk_rope); K is the broadcast
#     latent + k_pe; V IS the latent (k_latent_broadcast), read once per
#     position and shared across heads.
#   • the lightning indexer (stage 1/2) is unchanged — it scores its own
#     full-s_kv indexer keys to pick the top-K the sparse score then reads.
#
# Required dims: d_model, n_heads, d_qk_nope, d_qk_rope, d_v_head, d_kv_lora, d_q_lora, n_topk_keys (index_topk), n_indexer_heads, d_indexer_head.

role: attention
description: "MLA + DSA decode-time absorbed form. Latent KV (d_kv_lora+d_qk_rope) read MQA; kv_b_proj folded into Q/O per-head matmuls; sparse top-K main attention."
cache:
  family: MLA
  entries:
    - { node: kv_a_layernorm, kind: latent }
    - { node: k_pe_rope, kind: rope_key }
    # No format here: the stored format is the serving stack's, declared per
    # model (`quant_context.cache_formats.index_key`) — FP8 with an F32
    # scale per 128 channels for DeepSeek-V3.2 and GLM-MoE-DSA alike. HF's
    # GlmMoeDsaIndexer keeps it BF16; serving does not.
    - { node: indexer.key_concat, kind: index_key }

attn_variant: DSA
# The decode form still computes the top-K, and the shared-indexer decode
# form (`mla_dsa_attention_shared_absorbed`) still reads it: the same
# `dsa_topk` stream `mla_dsa_attention` produces.
stream_out: { dsa_topk: dsa_topk_mask }
graph:
  # --- Q path: compress → split heads → absorb W_uk (d_qk_nope→d_kv_lora) ---
  q_a_proj:           { op: linear, in: x, dims: { in: d_model, out: d_q_lora }, weight_axes: [{ replicated: true }, { replicated: true }] }
  q_a_layernorm:      { op: rmsnorm, in: q_a_proj, dim: d_q_lora, weight_axes: [{ replicated: true }] }
  q_b_proj:           { op: linear, in: q_a_layernorm, dims: { in: d_q_lora, out: "n_heads * (d_qk_nope + d_qk_rope)" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:      { op: head_split, in: q_b_proj, dims: { n_heads: n_heads, d_head: "d_qk_nope + d_qk_rope" } }
  q_nope_slice:       { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_nope } }
  q_pe_slice:         { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_rope } }
  q_pe_rope:          { op: rope, in: q_pe_slice, dim: d_qk_rope }
  kv_b_proj:          { op: parameter_tensor, shape: ["n_heads * (d_qk_nope + d_v_head)", d_kv_lora], tensor_suffix: { weight: .weight }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }   # the stored kv_b_proj; the per-head GEMMs at its address (`module: kv_b_proj`) run it
  q_absorbed_nope:    { op: per_head_linear, module: kv_b_proj, in: q_nope_slice, dims: { n_heads: n_heads, in: d_qk_nope, out: d_kv_lora }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }, { replicated: true }] }
  q_concat:           { op: concat, in: [q_absorbed_nope, q_pe_rope], dims: { in_a: d_kv_lora, in_b: d_qk_rope, out: "d_kv_lora + d_qk_rope" } }

  # --- Latent KV (head-shared): the cached bytes ---
  kv_a_proj_with_mqa: { op: linear, in: x, dims: { in: d_model, out: "d_kv_lora + d_qk_rope" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  kv_latent_slice:    { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_kv_lora } }
  k_pe_slice:         { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_qk_rope } }
  kv_a_layernorm:     { op: rmsnorm, in: kv_latent_slice, dim: d_kv_lora, weight_axes: [{ replicated: true }] }   # K_latent = V_latent (shared)
  k_pe_rope:          { op: rope_emb, in: k_pe_slice, dim: d_qk_rope }
  # One KV head: the cached latent and RoPE key, joined once per position
  # (the 576-wide entry the sparse/dense MLA kernel reads, `num_heads_k=1`),
  # then shown to every query head as a zero-byte view. Joining before the
  # broadcast keeps one copy of each cached position, not n_heads.
  kv_concat:          { op: concat, in: [kv_a_layernorm, k_pe_rope], dims: { in_a: d_kv_lora, in_b: d_qk_rope, out: "d_kv_lora + d_qk_rope" } }   # (B, s_kv, d_kv_lora+d_qk_rope)
  k_concat:           { op: head_broadcast, in: kv_concat, dims: { n_heads: n_heads } }   # (B, n_heads, s_kv, d_kv_lora+d_qk_rope), a view
  k_latent_broadcast: { op: head_broadcast, in: kv_a_layernorm, dims: { n_heads: n_heads } }   # V == the latent, a view

  # --- Lightning indexer (unchanged from decompressed): stage 1 logits, stage 2 top-K ---
  # Replicated on every rank, exactly as in the decompressed graph — absorption
  # rewrites the MLA path, not the indexer. See `mla_dsa_attention.yaml` for why
  # this is declared per node rather than read off the name.
  indexer.weights_proj: { op: linear, role: attention_indexer, in: x, dims: { in: d_model, out: n_indexer_heads }, weight_axes: [{ replicated: true }, { replicated: true }] }
  indexer.wk:           { op: linear, in: x, dims: { in: d_model, out: d_indexer_head }, weight_axes: [{ replicated: true }, { replicated: true }] }
  indexer.k_norm:       { op: layernorm, in: indexer.wk, dim: d_indexer_head, weight_axes: [{ replicated: true }] }
  indexer.wq_b:         { op: linear, in: q_a_layernorm, dims: { in: d_q_lora, out: "n_indexer_heads * d_indexer_head" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  # Indexer RoPE: rotate the first d_qk_rope dims of each indexer query head
  # and of the single indexer key, then put the rotated half back in front
  # (transformers DeepseekV32Indexer / GlmMoeDsaIndexer.forward:
  # split [rope, pass] → apply_rotary_pos_emb → cat; vLLM deepseek_v2.py
  # Indexer applies `indexer_rope_emb` to q[..., :rope_dim] / k[..., :rope_dim]).
  # The key is cached after rotation.
  indexer.q_split_heads: { op: head_split, in: indexer.wq_b, dims: { n_heads: n_indexer_heads, d_head: d_indexer_head } }
  indexer.q_pe_slice:   { op: slice, in: indexer.q_split_heads, dims: { in: d_indexer_head, out: d_qk_rope } }
  indexer.q_nope_slice: { op: slice, in: indexer.q_split_heads, dims: { in: d_indexer_head, out: "d_indexer_head - d_qk_rope" } }
  indexer.q_pe_rope:    { op: rope, in: indexer.q_pe_slice, dim: d_qk_rope }
  indexer.query_concat: { op: concat, in: [indexer.q_pe_rope, indexer.q_nope_slice], dims: { in_a: d_qk_rope, in_b: "d_indexer_head - d_qk_rope", out: d_indexer_head } }
  indexer.k_pe_slice:   { op: slice, in: indexer.k_norm, dims: { in: d_indexer_head, out: d_qk_rope } }
  indexer.k_nope_slice: { op: slice, in: indexer.k_norm, dims: { in: d_indexer_head, out: "d_indexer_head - d_qk_rope" } }
  indexer.k_pe_rope:    { op: rope_emb, in: indexer.k_pe_slice, dim: d_qk_rope }
  indexer.key_concat:   { op: concat, in: [indexer.k_pe_rope, indexer.k_nope_slice], dims: { in_a: d_qk_rope, in_b: "d_indexer_head - d_qk_rope", out: d_indexer_head } }
  indexer_logits:       { op: indexer_logits, in: [indexer.query_concat, indexer.key_concat, indexer.weights_proj], dims: { n_indexer_heads: n_indexer_heads, d_indexer_head: d_indexer_head } }
  dsa_topk_mask:        { op: dsa_topk_mask, in: indexer_logits, dims: { k: n_topk_keys } }

  # --- Sparse main attention IN LATENT SPACE (V == latent, MQA) ---
  qk_score:           { op: dsa_attention_score, in: [q_concat, k_concat, dsa_topk_mask], dims: { n_heads: n_heads, d_head: "d_kv_lora + d_qk_rope", k: n_topk_keys } }
  softmax:            { op: dsa_softmax, in: qk_score, dims: { n_heads: n_heads, k: n_topk_keys } }
  attn_apply_latent:  { op: dsa_attention_apply, in: [softmax, k_latent_broadcast], dims: { n_heads: n_heads, d_head: d_kv_lora, k: n_topk_keys } }

  # --- O side: absorb W_uv (d_kv_lora→d_v_head) per-head, merge, project ---
  v_absorbed:         { op: per_head_linear, module: kv_b_proj, in: attn_apply_latent, dims: { n_heads: n_heads, in: d_kv_lora, out: d_v_head }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }, { replicated: true }] }
  o_merge_heads:      { op: head_merge, in: v_absorbed, dims: { n_heads: n_heads, d_head: d_v_head } }
  o_proj:             { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
