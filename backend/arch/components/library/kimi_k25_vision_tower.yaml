# Kimi-K2.5 MoonViT vision tower + multimodal projector.
#
# Wraps the entire vision pipeline (patch embed + pos_emb + n_vis_layers MoonViT
# blocks + final layernorm + PatchMerger projector) as a single
# singleton aux_block. Singleton wrapper — leaves land at bare HF paths
# (no `vision.X.` prefix injection).
#
# Forward:
#   x = vision_tower.patch_embed.proj(image_patches)   # conv 14x14 → d_vis_model
#   x = x + vision_tower.patch_embed.pos_emb           # 2D learned PE
#   for blk in vision_tower.encoder.blocks: x = blk(x) # n_vis_layers ViT blocks
#   x = vision_tower.encoder.final_layernorm(x)
#   x = mm_projector.pre_norm(x)                       # rmsnorm
#   x = patch_merger(x)                                # n_spatial_merge×n_spatial_merge pixel-shuffle to d_proj_in
#   x = mm_projector.proj.0(x)                         # d_proj_in → d_proj_in
#   x = mm_projector.proj.2(x)                         # d_proj_in → d_model
#
# Required dims: d_vis_model, n_vis_heads, d_vis_head, d_vis_ffn, n_vis_layers, n_vis_channels, s_patch, PeH, PeW, d_proj_hidden, d_proj_in, d_model.

role: aux_block
description: "Kimi-K2.5 MoonViT vision tower + PatchMerger projector. Singleton wrapper — emits flat HF tensor paths (vision_tower.*, mm_projector.*)."

graph:
  vision_tower.patch_embed.proj:             { op: linear, in: x, dims: { in: "n_vis_channels * s_patch * s_patch", out: d_vis_model, bias: "1" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  vision_tower.patch_embed.pos_emb.weight:          { op: parameter_tensor, shape: ["PeH * PeW", d_vis_model], weight_axes: [{ replicated: true }, { replicated: true }] }
  vision_tower.patch_embed.add_pe:
    op: position_table_add
    in: [vision_tower.patch_embed.proj, vision_tower.patch_embed.pos_emb.weight]
    dim: d_vis_model
    formula: "y[b, i, :] = x[b, i, :] + pos_emb[i, :]   (lookup by flattened patch index)"
  vision_tower.encoder.blocks:               { op: kimi_k25_vision_block, in: vision_tower.patch_embed.add_pe, chain: n_vis_layers, checkpoint: { index: local }, role: aux_block }
  vision_tower.encoder.final_layernorm:      { op: layernorm, in: vision_tower.encoder.blocks, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  mm_projector.spatial_merge:                { op: spatial_merge, in: vision_tower.encoder.final_layernorm, dims: { n_spatial_merge: n_spatial_merge } }
  mm_projector.pre_norm:                     { op: layernorm, in: mm_projector.spatial_merge, dim: d_proj_hidden, weight_axes: [{ replicated: true }] }
  mm_projector.proj.0:                       { op: linear, in: mm_projector.pre_norm, dims: { in: d_proj_in, out: d_proj_in, bias: "1" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  mm_projector.proj.2:                       { op: linear, in: mm_projector.proj.0, dims: { in: d_proj_in, out: d_model, bias: "1" }, weight_axes: [{ replicated: true }, { replicated: true }] }

outputs: [mm_projector.proj.2]
