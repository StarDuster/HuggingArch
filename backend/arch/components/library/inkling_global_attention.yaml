# Inkling global (full) attention.
#
# Same novel structure as inkling_local_attention (GQA + QK-norm + KV
# short-convs + learned relative-position branch) but FULL attention (no
# window) and num_key_value_heads (n_kv_heads=8 → kv dim 1024). The rel-branch
# param bank is d_rel_logits*d_rel_proj here (rel_logits_proj.proj is [16,1024]).
role: attention
description: "Inkling global attention: full GQA + QK-norm + KV short-conv + learned relative-position branch."
cache:
  family: GQA
  entries:
    - { node: k_norm, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  wq_du:           { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  wk_dv:           { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  wv_dv:           { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  k_sconv:         { op: inkling_short_conv, in: wk_dv, dims: { C: "n_kv_heads * d_head", kernel_size: s_conv_kernel } }
  v_sconv:         { op: inkling_short_conv, in: wv_dv, dims: { C: "n_kv_heads * d_head", kernel_size: s_conv_kernel } }
  q_split_heads:   { op: head_split, in: wq_du,   dims: { n_heads: n_heads,  d_head: d_head } }
  k_split_heads:   { op: head_split, in: k_sconv, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:   { op: head_split, in: v_sconv, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_norm:          { op: rmsnorm, in: q_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  k_norm:          { op: rmsnorm, in: k_split_heads, dim: d_head, weight_axes: [{ replicated: true }] }
  wr_du:                 { op: linear, in: x, dims: { in: d_model, out: d_rel_proj }, weight_axes: [{ replicated: true }, { replicated: true }] }
  rel_logits_proj.proj:  { op: parameter_vector, dim: "d_rel_logits * d_rel_proj", weight_axes: [{ replicated: true }] }
  qk_score:        { op: attention_score, in: [q_norm, k_norm], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:   { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  wo_ud:           { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [wo_ud]
