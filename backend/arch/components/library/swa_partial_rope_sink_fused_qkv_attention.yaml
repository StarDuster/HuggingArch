# SWA + partial RoPE + asymmetric V head dim + per-head learnable sink,
# FUSED QKV projection.
# The form without a V scale. MiMo-V2.5 / V2.5-Pro / V2.6 scale V
# (`attention_value_scale`) and bind `swa_partial_rope_sink_fused_qkv_vscale_attention`.
#
# Same compute as `swa_partial_rope_sink_attention` but the Q/K/V
# projection is a single fused linear (HF tensor `self_attn.qkv_proj.weight`,
# out = n_heads*d_head + n_kv_heads*d_head + n_kv_heads*d_v_head) sliced and head-split. Per-head
# `attention_sink_bias` parameter (shape [n_heads]) is concatenated onto the
# scores before softmax.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, d_v_head, d_rope, d_nope, s_window (d_rope + d_nope == d_head).
role: attention
description: "SWA + partial RoPE + sink + asymmetric V head dim, fused QKV."
cache:
  family: SWA
  entries:
    - { node: key_concat, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  qkv_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_heads * d_head + n_kv_heads * d_head + n_kv_heads * d_v_head" }
    weight_axes:
      - segments:
          - { segment: q, extent: "n_heads * d_head", world: attention, parts: n_heads, fit: replica_cells }
          - { segment: k, extent: "n_kv_heads * d_head", world: attention, parts: n_kv_heads, fit: replica_cells }
          - { segment: v, extent: "n_kv_heads * d_v_head", world: attention, parts: n_kv_heads, fit: replica_cells }
      - { replicated: true }
  q_slice:             { op: slice, in: qkv_proj, dims: { in: "n_heads * d_head + n_kv_heads * d_head + n_kv_heads * d_v_head", out: "n_heads * d_head" } }
  k_slice:             { op: slice, in: qkv_proj, dims: { in: "n_heads * d_head + n_kv_heads * d_head + n_kv_heads * d_v_head", out: "n_kv_heads * d_head" } }
  v_slice:             { op: slice, in: qkv_proj, dims: { in: "n_heads * d_head + n_kv_heads * d_head + n_kv_heads * d_v_head", out: "n_kv_heads * d_v_head" } }
  q_split_heads:       { op: head_split, in: q_slice, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:       { op: head_split, in: k_slice, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:       { op: head_split, in: v_slice, dims: { n_heads: n_kv_heads, d_head: d_v_head } }
  q_pe_slice:          { op: slice, in: q_split_heads, dims: { in: d_head, out: d_rope } }
  q_nope_slice:        { op: slice, in: q_split_heads, dims: { in: d_head, out: d_nope } }
  k_pe_slice:          { op: slice, in: k_split_heads, dims: { in: d_head, out: d_rope } }
  k_nope_slice:        { op: slice, in: k_split_heads, dims: { in: d_head, out: d_nope } }
  q_pe_rope:           { op: rope_emb, in: q_pe_slice, dims: { dim: d_rope } }
  k_pe_rope:           { op: rope_emb, in: k_pe_slice, dims: { dim: d_rope } }
  query_concat:        { op: concat, in: [q_pe_rope, q_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  key_concat:          { op: concat, in: [k_pe_rope, k_nope_slice], dims: { in_a: d_rope, in_b: d_nope, out: d_head } }
  qk_score:            { op: swa_attention_score, in: [query_concat, key_concat], dims: { n_heads: n_heads, d_head: d_head, s_window: s_window } }
  attention_sink_bias: { op: parameter_vector, dim: n_heads, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }] }
  softmax:             { op: swa_softmax_with_sink, in: [qk_score, attention_sink_bias], dims: { n_heads: n_heads, s_window: s_window } }
  attn_apply:          { op: swa_attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_v_head, s_window: s_window } }
  o_merge_heads:       { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_v_head } }
  o_proj:              { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
