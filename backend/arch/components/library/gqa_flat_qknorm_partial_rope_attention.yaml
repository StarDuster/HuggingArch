# GQA + FLAT QK-RMSNorm + partial RoPE attention
# Used by: MiniMax-M2.7
#
# Structural differences vs `gqa_qknorm_attention`:
#   - QK-RMSNorm is applied to the FLAT projected tensor BEFORE the
#     view-into-heads, so q_norm.weight has shape [n_heads * d_head] and
#     k_norm.weight has shape [n_kv_heads * d_head] (not per-head [d_head]).
#   - Partial RoPE: only the first d_rope dims of each head are rotated;
#     the trailing d_head-d_rope dims pass through unchanged. d_rope == d_head recovers
#     standard full-head RoPE.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, d_rope   (d_rope <= d_head)

role: attention
description: "GQA with flat (pre-view) QK-RMSNorm + partial RoPE. MiniMax-M2."
cache:
  family: GQA
  entries:
    - { node: key_concat, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  q_norm:          { op: rmsnorm, in: q_proj, dim: "n_heads * d_head", weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }] }
  k_norm:          { op: rmsnorm, in: k_proj, dim: "n_kv_heads * d_head", weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }] }
  q_split_heads:      { op: head_split, in: q_norm, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_norm, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:      { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_pe_slice:      { op: slice, in: q_split_heads, dims: { in: d_head, out: d_rope } }
  q_nope_slice:    { op: slice, in: q_split_heads, dims: { in: d_head, out: "d_head - d_rope" } }
  k_pe_slice:      { op: slice, in: k_split_heads, dims: { in: d_head, out: d_rope } }
  k_nope_slice:    { op: slice, in: k_split_heads, dims: { in: d_head, out: "d_head - d_rope" } }
  q_pe_rope:       { op: rope_emb, in: q_pe_slice, dims: { dim: d_rope } }
  k_pe_rope:       { op: rope_emb, in: k_pe_slice, dims: { dim: d_rope } }
  query_concat:    { op: concat, in: [q_pe_rope, q_nope_slice], dims: { in_a: d_rope, in_b: "d_head - d_rope", out: d_head } }
  key_concat:      { op: concat, in: [k_pe_rope, k_nope_slice], dims: { in_a: d_rope, in_b: "d_head - d_rope", out: d_head } }
  qk_score:        { op: attention_score, in: [query_concat, key_concat], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
