# MiMo-V2.5 vision tower windowed-attention block (24/28 vision blocks).
#
# Topology: pre-norm RMSNorm → biased fused QKV (GQA, n_vis_heads vs
# n_vis_kv_heads) → 2-D vision RoPE on q and k → bidirectional sliding-window
# attention with a per-head key-0 logit bias → biased output proj → +residual
# → pre-FFN RMSNorm → biased SwiGLU FFN → +residual.
#
# vLLM mimo_v2_omni.py MiMoVisionAttention:
#   q, k rotated on every block (:287-290);
#   window blocks call `_forward_window_attn` (:209-251) →
#   `context_attention_fwd(..., is_causal=False, sliding_window_q=w,
#   sliding_window_k=w, sinks=sinks, sinks_bias_key0=True)`, w =
#   `vision_config.visual_token_window_size`. The kernel masks |i − j| ≤ w
#   (triton_prefill_attention.py:149-159), 2w + 1 keys = `s_vis_window`, and
#   adds the sink to the logit of key 0 (`qk + sink` where `pos_k == 0`), not as
#   a denominator column. `vit_window_attn_types` only reorders the tokens
#   (row / column order, :598-644) before this 1-D window.
#
# Required dims: d_vis_model, n_vis_heads, n_vis_kv_heads, d_vis_head, d_vis_ffn, s_vis_window
role: block
description: "MiMo-V2.5 ViT windowed block: biased fused-QKV GQA + 2-D RoPE + bidirectional ±w window with a per-head key-0 bias + biased SwiGLU MLP. 24/28 vision blocks."

graph:
  norm1:            { op: rmsnorm, in: x, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  attn.qkv:         { op: linear, in: norm1, dims: { in: d_vis_model, out: "n_vis_heads * d_vis_head + n_vis_kv_heads * d_vis_head + n_vis_kv_heads * d_vis_head", bias: "1" }, weight_axes: [{ segments: [{ segment: q, extent: "n_vis_heads * d_vis_head", world: attention, parts: n_vis_heads, fit: replica_cells }, { segment: k, extent: "n_vis_kv_heads * d_vis_head", world: attention, parts: n_vis_kv_heads, fit: replica_cells }, { segment: v, extent: "n_vis_kv_heads * d_vis_head", world: attention, parts: n_vis_kv_heads, fit: replica_cells }] }, { replicated: true }] }
  attn.q_slice:     { op: slice, in: attn.qkv, dims: { in: "n_vis_heads * d_vis_head + n_vis_kv_heads * d_vis_head + n_vis_kv_heads * d_vis_head", out: "n_vis_heads * d_vis_head" } }
  attn.k_slice:     { op: slice, in: attn.qkv, dims: { in: "n_vis_heads * d_vis_head + n_vis_kv_heads * d_vis_head + n_vis_kv_heads * d_vis_head", out: "n_vis_kv_heads * d_vis_head" } }
  attn.v_slice:     { op: slice, in: attn.qkv, dims: { in: "n_vis_heads * d_vis_head + n_vis_kv_heads * d_vis_head + n_vis_kv_heads * d_vis_head", out: "n_vis_kv_heads * d_vis_head" } }
  attn.q_split:     { op: head_split, in: attn.q_slice, dims: { n_heads: n_vis_heads, d_head: d_vis_head } }
  attn.k_split:     { op: head_split, in: attn.k_slice, dims: { n_heads: n_vis_kv_heads, d_head: d_vis_head } }
  attn.v_split:     { op: head_split, in: attn.v_slice, dims: { n_heads: n_vis_kv_heads, d_head: d_vis_head } }
  attn.q_rope:      { op: rope_2d, in: attn.q_split, dim: d_vis_head }
  attn.k_rope:      { op: rope_2d, in: attn.k_split, dim: d_vis_head }
  # Bidirectional ±w window: each query sees the s_vis_window = 2w + 1 keys
  # around it (vLLM context_attention_fwd(..., is_causal=False,
  # sliding_window_q=w, sliding_window_k=w)).
  attn.qk_score:    { op: swa_attention_score, in: [attn.q_rope, attn.k_rope], dims: { is_causal: "0", n_heads: n_vis_heads, d_head: d_vis_head, s_window: s_vis_window } }
  attn.sinks:       { op: parameter_vector, dim: n_vis_heads, weight_axes: [{ world: attention, parts: n_vis_heads, fit: replica_cells }] }
  attn.softmax:     { op: swa_softmax_key0_bias, in: [attn.qk_score, attn.sinks], dims: { is_causal: "0", n_heads: n_vis_heads, s_window: s_vis_window } }
  attn.apply:       { op: swa_attention_apply, in: [attn.softmax, attn.v_split], dims: { is_causal: "0", n_heads: n_vis_heads, d_head: d_vis_head, s_window: s_vis_window } }
  attn.merge:       { op: head_merge, in: attn.apply, dims: { n_heads: n_vis_heads, d_head: d_vis_head } }
  attn.proj:        { op: linear, in: attn.merge, dims: { in: "n_vis_heads * d_vis_head", out: d_vis_model, bias: "1" }, weight_axes: [{ replicated: true }, { world: attention, parts: n_vis_heads, fit: replica_cells }] }
  attn_residual:    { op: add, in: [x, attn.proj], dim: d_vis_model }
  norm2:            { op: rmsnorm, in: attn_residual, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  mlp.gate_proj:    { op: linear, in: norm2, dims: { in: d_vis_model, out: d_vis_ffn, bias: "1" }, weight_axes: [{ world: dense_ffn, parts: d_vis_ffn, fit: exact }, { replicated: true }] }
  mlp.up_proj:      { op: linear, in: norm2, dims: { in: d_vis_model, out: d_vis_ffn, bias: "1" }, weight_axes: [{ world: dense_ffn, parts: d_vis_ffn, fit: exact }, { replicated: true }] }
  mlp.silu:         { op: silu, in: mlp.gate_proj, dim: d_vis_ffn }
  mlp.gated:        { op: mul, in: [mlp.silu, mlp.up_proj], dim: d_vis_ffn }
  mlp.down_proj:    { op: linear, in: mlp.gated, dims: { in: d_vis_ffn, out: d_vis_model, bias: "1" }, weight_axes: [{ replicated: true }, { world: dense_ffn, parts: d_vis_ffn, fit: exact }] }
  out:              { op: add, in: [attn_residual, mlp.down_proj], dim: d_vis_model }
outputs: [out]
