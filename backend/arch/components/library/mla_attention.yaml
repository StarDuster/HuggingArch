# MLA Attention with Q compression (DeepSeek-V3 style)
# Used by: DeepSeek-V3, models with q_lora_rank > 0
#
# Q path:  x → q_a_proj (d_model→d_q_lora) → q_a_norm → q_b_proj (d_q_lora→n_heads*(d_qk_nope+d_qk_rope))
# KV path: x → kv_a_proj (d_model→d_kv_lora+d_qk_rope) → kv_a_norm → kv_b_proj (d_kv_lora→n_heads*(d_qk_nope+d_v_head))
#
# Required dims: d_model, n_heads, d_qk_nope (qk_nope_head_dim), d_qk_rope (qk_rope_head_dim),
#                d_v_head (v_head_dim), d_kv_lora (kv_lora_rank), d_q_lora (q_lora_rank)
# Selection signal: config.q_lora_rank > 0
#
# Every tensor transformation (slice / concat / rope / matmul / norm) is its
# own node — matches PyTorch FX / ONNX style. slice & concat are zero-FLOP
# view ops, visually distinct (view style) from compute ops.

role: attention
description: "Multi-head Latent Attention with Q-LoRA + KV-LoRA compression. DSv2/V3, Kimi-K2/K2.5, LongCat."
cache:
  family: MLA
  entries:
    - { node: kv_a_layernorm, kind: latent }
    - { node: k_pe_rope, kind: rope_key }
# At decode the KV is read in latent space rather than decompressed —
# a different subgraph, not the same one at a shorter sequence.
decode_variant: mla_attention_absorbed

graph:
  q_a_proj:           { op: linear, in: x, dims: { in: d_model, out: d_q_lora }, weight_axes: [{ replicated: true }, { replicated: true }] }
  q_a_layernorm:      { op: rmsnorm, in: q_a_proj, dim: d_q_lora, weight_axes: [{ replicated: true }] }
  q_b_proj:
    op: linear
    in: q_a_layernorm
    dims: { in: d_q_lora, out: "n_heads * (d_qk_nope + d_qk_rope)" }
    weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }]
  # q_b is stored head-major. Split that real index map before taking the
  # per-head nope/rope fields; concatenating two flattened H*D ranges would
  # group all nope values before all rope values and is not a head pack.
  q_split_heads:      { op: head_split, in: q_b_proj, dims: { n_heads: n_heads, d_head: "d_qk_nope + d_qk_rope" } }
  q_nope_slice:       { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_nope } }
  q_pe_slice:         { op: slice, in: q_split_heads, dims: { in: "d_qk_nope + d_qk_rope", out: d_qk_rope } }
  kv_a_proj_with_mqa: { op: linear, in: x, dims: { in: d_model, out: "d_kv_lora + d_qk_rope" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  kv_latent_slice:    { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_kv_lora } }
  k_pe_slice:         { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_qk_rope } }
  kv_a_layernorm:     { op: rmsnorm, in: kv_latent_slice, dim: d_kv_lora, weight_axes: [{ replicated: true }] }
  # The cached latent and rope key are re-read for every position a
  # prefill attends (`kv_cache_view`): behind a cached prefix the
  # attention spans s_kv rows while this step wrote s_query of them, and
  # the prefix rows are read from the cache and decompressed again
  # (vLLM mla/common.py _compute_prefill_context; sglang forward_mha.py
  # _fused_prefix_extend_attn_mha). Decode reads the latent directly
  # (`decode_variant`).
  # One position per cached row: the MLA cache is per token, not pooled.
  kv_latent_read:     { op: kv_cache_view, in: kv_a_layernorm, dims: { compress_ratio: "1" } }
  kv_b_proj:
    op: linear
    in: kv_latent_read
    dims: { in: d_kv_lora, out: "n_heads * (d_qk_nope + d_v_head)" }
    weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }]
  kv_split_heads:     { op: head_split, in: kv_b_proj, dims: { n_heads: n_heads, d_head: "d_qk_nope + d_v_head" } }
  k_nope_slice:       { op: slice, in: kv_split_heads, dims: { in: "d_qk_nope + d_v_head", out: d_qk_nope } }
  value_slice:        { op: slice, in: kv_split_heads, dims: { in: "d_qk_nope + d_v_head", out: d_v_head } }
  q_pe_rope:          { op: rope, in: q_pe_slice, dim: d_qk_rope }
  k_pe_rope:          { op: rope_emb, in: k_pe_slice, dim: d_qk_rope }
  k_pe_read:          { op: kv_cache_view, in: k_pe_rope, dims: { compress_ratio: "1" } }
  query_concat:       { op: concat, in: [q_nope_slice, q_pe_rope], dims: { in_a: d_qk_nope, in_b: d_qk_rope, out: "d_qk_nope + d_qk_rope" } }
  # k_pe is shared across heads, so head_broadcast fans it out before the
  # per-head trailing-axis concat.
  k_pe_split:         { op: head_broadcast, in: k_pe_read, dims: { n_heads: n_heads } }
  k_split_heads:      { op: concat, in: [k_nope_slice, k_pe_split], dims: { in_a: d_qk_nope, in_b: d_qk_rope, out: "d_qk_nope + d_qk_rope" } }
  qk_score:           { op: attention_score, in: [query_concat, k_split_heads], dims: { n_heads: n_heads, d_head: "d_qk_nope + d_qk_rope" } }
  softmax:            { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:         { op: attention_apply, in: [softmax, value_slice], dims: { n_heads: n_heads, d_head: d_v_head } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_v_head } }
  o_proj:             { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
