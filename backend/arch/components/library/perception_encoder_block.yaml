# Perception Encoder ViT block (CLIP-style, with LayerScale).
# Used by: Step-3.7-Flash vision tower (vision_model.transformer.resblocks).
#
# Topology — pre-norm with LayerScale on both branches:
#   x = x + ls_1.gamma * attn(ln_1(x))
#   x = x + ls_2.gamma * mlp(ln_2(x))
#
# Sub-components are role-tagged so attention/FFN params land in the
# right bucket of the dashboard view.
#
# Required dims: d_vis_model, n_vis_heads, d_vis_head, d_vis_ffn     (d_vis_model = n_vis_heads * d_vis_head)

role: block
description: "Perception Encoder ViT block: pre-norm + LayerScale + fused-QKV attn + biased GELU MLP."

graph:
  ln_1:           { op: layernorm, in: x, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  attn:           { op: perception_encoder_attention, in: ln_1 }
  ls_1.gamma:     { op: parameter_vector, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  pe_scaled_attn: { op: mul, in: [attn, ls_1.gamma], dim: d_vis_model }
  pe_attn_residual:  { op: add, in: [x, pe_scaled_attn], dim: d_vis_model }

  ln_2:           { op: layernorm, in: pe_attn_residual, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  mlp:            { op: perception_encoder_mlp, in: ln_2 }
  ls_2.gamma:     { op: parameter_vector, dim: d_vis_model, weight_axes: [{ replicated: true }] }
  pe_scaled_mlp:  { op: mul, in: [mlp, ls_2.gamma], dim: d_vis_model }
  pe_block_out:   { op: add, in: [pe_attn_residual, pe_scaled_mlp], dim: d_vis_model }
outputs: [pe_block_out]
