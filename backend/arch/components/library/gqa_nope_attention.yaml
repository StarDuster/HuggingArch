# GQA Attention without positional encoding (NoPE).
# Used by: Nemotron-H (Nemotron-3 Nano / Ultra attention layers).
#
# Same projections, head layout and score/apply as `gqa_attention`, but q and
# k enter the score un-rotated: the Mamba layers carry position, and the
# attention layers apply no rotary embedding. HF
# `NemotronHAttention.forward` goes q/k/v_proj -> view -> attention -> o_proj
# with no rotary call; vLLM `NemotronHAttention` builds no rope at all
# (`qkv_proj -> split -> attn -> o_proj`). With no rope node, the cached K is
# the head-split k projection itself.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head
# Optional dims: Qb (QKV bias, 0=no bias, 1=has bias, default 0)

role: attention
description: "Grouped-Query Attention with no positional encoding (NoPE) and no QK-norm. Nemotron-H attention layers."
cache:
  family: GQA
  entries:
    - { node: k_split_heads, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_heads * d_head", bias: Qb }
    weight_axes:
      - placement_by_symbol:
          n_heads: { world: attention, parts: n_heads, fit: replica_cells }
      - { replicated: true }
  k_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }
    weight_axes:
      - placement_by_symbol:
          n_kv_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
          n_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
      - { replicated: true }
  v_proj:
    op: linear
    in: x
    dims: { in: d_model, out: "n_kv_heads * d_head", bias: Qb }
    weight_axes:
      - placement_by_symbol:
          n_kv_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
          n_heads: { world: attention, parts: n_kv_heads, fit: replica_cells }
      - { replicated: true }
  q_split_heads:      { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:      { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  qk_score:        { op: attention_score, in: [q_split_heads, k_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:
    op: linear
    in: o_merge_heads
    dims: { in: "n_heads * d_head", out: d_model }
    weight_axes:
      - { replicated: true }
      - placement_by_symbol:
          n_heads: { world: attention, parts: n_heads, fit: replica_cells }
outputs: [o_proj]
