# Head-merge: 4-D head-major → per-token flat. Inverse of head_split.
#
#   [B, n_heads, s_ctx, d_head]   --transpose-->   [B, s_ctx, n_heads, d_head]   --view_merge-->   [B, s_ctx, n_heads·d_head]
#
# Used at the attention output (after attention_apply) before the
# final `o_proj` linear, in every attention variant (MHA, MQA, GQA,
# MLA — anywhere we transpose attention output back and reshape into
# the per-token feature dim for o_proj).
#
# Required dims at call site: n_heads, d_head, out (= n_heads·d_head in the canonical case;
# spec writers can pass any value if a downstream reshape narrows it).

description: "Transpose (B, n_heads, s_ctx, d_head) → (B, s_ctx, n_heads, d_head) and merge last two dims. 1-line head_merge replacing inline transpose + view_merge."
graph:
  permute: { op: transpose, in: x, axes: [0, 2, 1, 3] }
  flatten: { op: view_merge, in: permute }
outputs: [flatten]
