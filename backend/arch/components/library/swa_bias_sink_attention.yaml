# Sliding-Window GQA + bias on every linear (q/k/v/o) + per-head learnable
# `sinks` scalar.
# First observed in: GPT-OSS (OpenAI gpt-oss-20b/120b) "sliding_attention"
# layers (s_window=128 in 20b).
#
# Same topology as `gqa_bias_sink_attention` but the score / softmax /
# apply ops are the SWA variants (s_ctx × min(s_ctx, s_window) instead of s_ctx²).
#
# Required dims: d_model, n_heads, n_kv_heads, d_head, s_window

role: attention
description: "SWA + bias on Q/K/V/O + per-head learnable sinks. GPT-OSS sliding-attention layers."
cache:
  family: SWA
  entries:
    - { node: k_rope, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head",  bias: "1" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head", bias: "1" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head", bias: "1" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:      { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:      { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:      { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_rope:          { op: rope, in: q_split_heads, dim: d_head }
  k_rope:          { op: rope, in: k_split_heads, dim: d_head }
  qk_score:        { op: swa_attention_score, in: [q_rope, k_rope], dims: { n_heads: n_heads, d_head: d_head, s_window: s_window } }
  sinks:           { op: parameter_vector, dim: n_heads, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }] }
  softmax:         { op: swa_softmax_with_sink, in: [qk_score, sinks], dims: { n_heads: n_heads, s_window: s_window } }
  attn_apply:      { op: swa_attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head, s_window: s_window } }
  o_merge_heads:      { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model, bias: "1" }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
