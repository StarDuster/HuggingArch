# MLA with `dense` output linear — decode-time ABSORBED form.
#
# Stands to `mla_attention_dense` as `mla_attention_absorbed` stands to
# `mla_attention`: W_uk folds into the Q side, W_uv into the O side,
# `kv_b_proj` disappears, attention contracts in latent space, and the latent
# KV is read once per position instead of decompressed per head.
#
# Two things carry over from the prefill sibling and are the whole reason this
# is a separate file rather than a reuse of `mla_attention_absorbed`: the
# output linear is named `dense` (Bailing-MoE V2.5 / Ling-2.6 ships
# `attention.dense.weight`), and the nope dim is spelled `d_head`, not
# `d_qk_nope`. Both names are load-bearing — the first for checkpoint
# matching, the second for dim resolution.
#
# Required dims: d_model, n_heads, d_head, d_qk_rope, d_v_head, d_kv_lora, d_q_lora.
# Selection signal: phase == decode AND base spec uses mla_attention_dense.

role: attention
description: "MLA decode-time absorbed form with `dense` output (vs `o_proj`). Bailing-MoE V2.5 / Ling-2.6."
cache:
  family: MLA
  entries:
    - { node: kv_a_layernorm, kind: latent }
    - { node: k_pe_rope, kind: rope_key }
graph:
  # --- Q path: LoRA down/up, unchanged by absorption ---
  q_a_proj:           { op: linear, in: x, dims: { in: d_model, out: d_q_lora }, weight_axes: [{ replicated: true }, { replicated: true }] }
  q_a_layernorm:      { op: rmsnorm, in: q_a_proj, dim: d_q_lora, weight_axes: [{ replicated: true }] }
  q_b_proj:           { op: linear, in: q_a_layernorm, dims: { in: d_q_lora, out: "n_heads * (d_head + d_qk_rope)" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:      { op: head_split, in: q_b_proj, dims: { n_heads: n_heads, d_head: "d_head + d_qk_rope" } }
  q_nope_slice:       { op: slice, in: q_split_heads, dims: { in: "d_head + d_qk_rope", out: d_head } }
  q_pe_slice:         { op: slice, in: q_split_heads, dims: { in: "d_head + d_qk_rope", out: d_qk_rope } }
  q_pe_rope:          { op: rope, in: q_pe_slice, dim: d_qk_rope }
  # W_uk per-head, d_head → d_kv_lora: the K-decoder half of kv_b_proj.
  kv_b_proj:          { op: parameter_tensor, shape: ["n_heads * (d_head + d_v_head)", d_kv_lora], tensor_suffix: { weight: .weight }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }   # the stored kv_b_proj; the per-head GEMMs at its address (`module: kv_b_proj`) run it
  q_absorbed_nope:    { op: per_head_linear, module: kv_b_proj, in: q_nope_slice, dims: { n_heads: n_heads, in: d_head, out: d_kv_lora }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }, { replicated: true }] }
  q_concat:           { op: concat, in: [q_absorbed_nope, q_pe_rope], dims: { in_a: d_kv_lora, in_b: d_qk_rope, out: "d_kv_lora + d_qk_rope" } }

  # --- Latent KV (head-shared): the cached bytes ---
  kv_a_proj_with_mqa: { op: linear, in: x, dims: { in: d_model, out: "d_kv_lora + d_qk_rope" }, weight_axes: [{ replicated: true }, { replicated: true }] }
  kv_latent_slice:    { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_kv_lora } }
  k_pe_slice:         { op: slice, in: kv_a_proj_with_mqa, dims: { in: "d_kv_lora + d_qk_rope", out: d_qk_rope } }
  kv_a_layernorm:     { op: rmsnorm, in: kv_latent_slice, dim: d_kv_lora, weight_axes: [{ replicated: true }] }   # K_latent = V_latent (shared)
  k_pe_rope:          { op: rope_emb, in: k_pe_slice, dim: d_qk_rope }
  # One KV head: the cached latent and RoPE key, joined once per position
  # (the 576-wide entry the sparse/dense MLA kernel reads, `num_heads_k=1`),
  # then shown to every query head as a zero-byte view. Joining before the
  # broadcast keeps one copy of each cached position, not n_heads.
  kv_concat:          { op: concat, in: [kv_a_layernorm, k_pe_rope], dims: { in_a: d_kv_lora, in_b: d_qk_rope, out: "d_kv_lora + d_qk_rope" } }   # (B, s_kv, d_kv_lora+d_qk_rope)
  k_concat:           { op: head_broadcast, in: kv_concat, dims: { n_heads: n_heads } }   # (B, n_heads, s_kv, d_kv_lora+d_qk_rope), a view
  k_latent_broadcast: { op: head_broadcast, in: kv_a_layernorm, dims: { n_heads: n_heads } }   # V == the latent, a view

  # --- Attention in latent space (contraction d_kv_lora + d_qk_rope) ---
  qk_score:           { op: attention_score, in: [q_concat, k_concat], dims: { n_heads: n_heads, d_head: "d_kv_lora + d_qk_rope" } }
  softmax:            { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply_latent:  { op: attention_apply, in: [softmax, k_latent_broadcast], dims: { n_heads: n_heads, d_head: d_kv_lora } }

  # --- O side: absorb W_uv per-head (d_kv_lora → d_v_head), merge, project ---
  v_absorbed:         { op: per_head_linear, module: kv_b_proj, in: attn_apply_latent, dims: { n_heads: n_heads, in: d_kv_lora, out: d_v_head }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }, { replicated: true }] }
  o_merge_heads:      { op: head_merge, in: v_absorbed, dims: { n_heads: n_heads, d_head: d_v_head } }
  dense:              { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_v_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [dense]
