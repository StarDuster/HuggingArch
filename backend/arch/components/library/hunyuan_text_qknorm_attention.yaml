# HunYuanVL text (dense) attention.
# HunYuanVLDenseV1Attention forward:
#   q = q_proj(x).view(..,n_heads,d_head); k = k_proj(x); v = v_proj(x)   (bias-free)
#   q,k = xdrope(q), xdrope(k)                                            (full-dim XD-RoPE)
#   q = query_layernorm(q); k = key_layernorm(k)                          (RMSNorm on d_head)
#   attn = softmax(qk / sqrt(d_head)) @ v ; o = o_proj(attn)
#
# Same topology as gqa_qknorm_attention, but the per-head QK RMSNorms are named
# query_layernorm / key_layernorm in this checkpoint (not q_norm / k_norm), and
# the norm is applied AFTER RoPE. No QKV bias (config.attention_bias == false).
# vLLM applies the same order (vllm/model_executor/models/hunyuan_v1.py
# HunYuanAttention.forward: `q, k = self.rotary_emb(positions, q, k)`, then
# `q = self.query_layernorm(...)` / `k = self.key_layernorm(...)`).
# The rotation is XD-RoPE: the config's rope type is `xdrope` with
# `xdrope_section` [16, 16, 16, 16], four position streams (p, w, h, t), and
# vLLM builds `XDRotaryEmbedding` for it (hunyuan_v1.py:209-213 `get_rope`;
# rotary_embedding/__init__.py:231-241), which rotates q and k with one
# `ApplyRotaryEmb` call each (xdrope.py:89-138) — `op: xdrope`, one node per
# tensor.
#
# Required dims: d_model, n_heads, n_kv_heads, d_head
role: attention
description: "GQA + full XD-RoPE + per-head QK-RMSNorm (query_layernorm/key_layernorm), norm after RoPE, no QKV bias. HunYuanVL text."
cache:
  family: GQA
  entries:
    - { node: key_layernorm, kind: kv }
    - { node: v_split_heads, kind: kv }
graph:
  q_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_heads * d_head" }, weight_axes: [{ world: attention, parts: n_heads, fit: replica_cells }, { replicated: true }] }
  k_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  v_proj:          { op: linear, in: x, dims: { in: d_model, out: "n_kv_heads * d_head" }, weight_axes: [{ world: attention, parts: n_kv_heads, fit: replica_cells }, { replicated: true }] }
  q_split_heads:   { op: head_split, in: q_proj, dims: { n_heads: n_heads, d_head: d_head } }
  k_split_heads:   { op: head_split, in: k_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  v_split_heads:   { op: head_split, in: v_proj, dims: { n_heads: n_kv_heads, d_head: d_head } }
  q_rope:          { op: xdrope, in: q_split_heads, dim: d_head }
  k_rope:          { op: xdrope, in: k_split_heads, dim: d_head }
  query_layernorm: { op: rmsnorm, in: q_rope, dim: d_head, weight_axes: [{ replicated: true }] }
  key_layernorm:   { op: rmsnorm, in: k_rope, dim: d_head, weight_axes: [{ replicated: true }] }
  qk_score:        { op: attention_score, in: [query_layernorm, key_layernorm], dims: { n_heads: n_heads, d_head: d_head } }
  softmax:         { op: softmax, in: qk_score, dims: { n_heads: n_heads } }
  attn_apply:      { op: attention_apply, in: [softmax, v_split_heads], dims: { n_heads: n_heads, d_head: d_head } }
  o_merge_heads:   { op: head_merge, in: attn_apply, dims: { n_heads: n_heads, d_head: d_head } }
  o_proj:          { op: linear, in: o_merge_heads, dims: { in: "n_heads * d_head", out: d_model }, weight_axes: [{ replicated: true }, { world: attention, parts: n_heads, fit: replica_cells }] }
outputs: [o_proj]
