# Clamped SwiGLU activation fusion — both pre-activation clamps, the SiLU and
# the multiply collapsed into one elementwise launch.
#
# Naive subgraph (`swiglu_ffn_clamped`, DeepSeek-V4 experts):
#   gate_clamp: g = min(gate, limit)
#   up_clamp:   u = clamp(up, −limit, limit)
#   silu:       s = silu(g)
#   mul:        z = s * u
#
# `silu_and_mul` covers the unclamped chain; without this plan the two clamps
# would stay standalone launches that write and re-read the d_ffn-wide
# pre-activations, which no serving stack does.
#
# vLLM:   SiluAndMulWithClamp (model_executor/layers/activation.py), CUDA op
#         `torch.ops._C.silu_and_mul_with_clamp`; DeepseekV4MLP uses it
#         whenever `swiglu_limit` is set (models/deepseek_v4/nvidia/model.py).
# sglang: `silu_and_mul_clamp` (kernels/ops/moe/dsv4.py:186), called by
#         DeepseekV2MLP when `swiglu_limit` is set (models/deepseek_v2.py).
#
# Cost preservation: Cost.combine sums the matched values.

fused_op: silu_and_mul_with_clamp

naive_pattern:
  nodes:
    gate_clamp: { op: clamp, inputs: [external.gate] }
    up_clamp:   { op: clamp, inputs: [external.up] }
    silu:       { op: silu,  inputs: [gate_clamp.out] }
    mul:        { op: mul,   inputs: [silu.out, up_clamp.out] }
    quant: { op: quantise_activation, inputs: [mul.out], optional: true }
  io_mapping:
    gate:   external.gate
    up:     external.up
    output: quant.out

# Output contract — the act-and-mul family's rule (conditions principle,
# 2026-10-19): an elementwise activation epilogue writes at the precision
# its consuming GEMM reads. Framework examples: vLLM's activation-quant
# fusion folds the per-token-group quantise into silu_and_mul
# (compilation/passes/fusion/act_quant_fusion.py `SiluMulBlockQuantPattern`
# :179, pass :277), and sglang's DeepSeek MLP writes the FP8 operand and its
# per-128 scales from the activation launch (`silu_and_mul_contig_post_quant`,
# srt/models/deepseek_v2.py:390-417). Which activations a given release's
# pass happens to cover is framework detail not modelled. The graph gates
# it: the launch takes the `quantise_activation` cast after it as an optional
# member, which exists only where the consuming GEMM reads a quantised
# operand, and binds it only when that cast is the output's one reader
# (`fusion.Fusion._closed` — a consumer that wants the row wide keeps the
# cast apart). A BF16 deployment has no cast and is unaffected.
