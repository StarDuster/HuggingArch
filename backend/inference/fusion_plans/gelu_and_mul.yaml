# GeGLU activation fusion — `gelu(gate) * up` collapsed into one
# elementwise op, matching vLLM's `gelu_and_mul` custom kernel.
#
# Naive subgraph:
#   gelu: y = gelu(gate_proj.out)
#   mul:  z = y * up_proj.out
#
# Used by GeGLU FFN variants — Gemma 1/2/3/4 (tanh-approx gelu, op
# `gelu_tanh`), T5 (`is_gated_act=True` with gelu_new, also `gelu_tanh`),
# exact-GELU GeGLU (op `gelu`). Both ops fuse here: vLLM's GeluAndMul is
# one module whose `approximate=` argument picks the kernel
# (`torch.ops._C.gelu_and_mul` / `gelu_tanh_and_mul`, chosen in __init__ at activation.py:436-439, cover the approximations via
# different dispatch arguments), and the fused cost is the same.
#
# vLLM kernel ref:
#   csrc/activation_kernels.cu          (gelu_and_mul :326 / gelu_tanh_and_mul :333 kernels)
#   vllm/model_executor/layers/activation.py::GeluAndMul
#     (forward_cuda dispatches `torch.ops._C.gelu_and_mul` /
#      `torch.ops._C.gelu_tanh_and_mul`
#      based on `approximate=` ("none" / "tanh"); activation.py:436-439, :456-461)
#
# sglang kernel ref:
#   sglang re-uses vLLM's `torch.ops._C.gelu_and_mul` family through
#   its `GeluAndMul` Python wrapper at
#   sglang/srt/layers/activation.py::GeluAndMul.
#
# Cost preservation: tautological — `gelu_and_mul` computes element-
# wise `gelu(gate) * up` with the same arithmetic intensity as the
# naive chain. Cost.combine sums the matched cost-layer values.

fused_op: gelu_and_mul

naive_pattern:
  nodes:
    gelu:
      op_choices: [gelu, gelu_tanh]
      inputs: [external.gate]
    mul:  { op: mul,  inputs: [gelu.out, external.up] }
    quant: { op: quantise_activation, inputs: [mul.out], optional: true }
  io_mapping:
    gate:   external.gate
    up:     external.up
    output: quant.out

# Output contract — the act-and-mul family's rule (conditions principle,
# 2026-10-19): an elementwise activation epilogue writes at the precision
# its consuming GEMM reads. Framework examples: vLLM's activation-quant
# fusion folds the per-token-group quantise into silu_and_mul
# (compilation/passes/fusion/act_quant_fusion.py `SiluMulBlockQuantPattern`
# :179, pass :277), and sglang's DeepSeek MLP writes the FP8 operand and its
# per-128 scales from the activation launch (`silu_and_mul_contig_post_quant`,
# srt/models/deepseek_v2.py:390-417). Which activations a given release's
# pass happens to cover is framework detail not modelled. The graph gates
# it: the launch takes the `quantise_activation` cast after it as an optional
# member, which exists only where the consuming GEMM reads a quantised
# operand, and binds it only when that cast is the output's one reader
# (`fusion.Fusion._closed` — a consumer that wants the row wide keeps the
# cast apart). A BF16 deployment has no cast and is unaffected.
