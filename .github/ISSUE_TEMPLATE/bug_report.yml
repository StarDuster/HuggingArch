name: "🐛 Bug report"
description: Something is broken or a number looks wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: input
    id: model_id
    attributes:
      label: Model id (if applicable)
      placeholder: org/Model-Name
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A CLI command, an API call, or the page + inputs you used.
      render: shell
  - type: input
    id: version
    attributes:
      label: How are you running it?
      placeholder: "local (commit sha) / the live demo / self-hosted"
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
